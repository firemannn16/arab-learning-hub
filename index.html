<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Тренажеры и другое</title>
    <script src="theme.js"></script>
    <script>
      // Всегда отправляем фывыфвноследнюю страницу, укуесли есть (кроме случая ?home=1)
      (function() {
        const urlParams = new URLSearchParams(location.search);
        const stayOnHome = urlParams.has('home');
        if (!stayOnHome) {
          const lastPage = localStorage.getItem('arabLastPage');
          if (lastPage && lastPage !== 'index.html') {
            window.location.replace(lastPage);
          }
        }
      })();
    </script>
    <link rel="stylesheet" href="theme.css">
    <script src="service-worker-register.js"></script>
    <script src="dua.js"></script>
    <script src="auth.js"></script>
    <script>
      (function authGuard() {
        document.documentElement.style.display = 'none';
        function waitAndCheck() {
          if (window.auth && window.authUser !== undefined) {
            if (!window.auth.isLoggedIn()) {
              document.documentElement.style.display = '';
              window.auth.openModal();
            } else {
              document.documentElement.style.display = '';
            }
          } else {
            setTimeout(waitAndCheck, 200);
          }
        }
        waitAndCheck();
      })();
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .code-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .code-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .code-btn:hover {
            background: #667eea;
            color: white;
        }
        .status-indicator {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }
        .status-online {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }
        .status-offline {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #f44336;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .status-dot.online {
            background: #4caf50;
        }
        .status-dot.offline {
            background: #f44336;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }
        .modal-text {
            font-size: 1em;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.6;
        }
        .code-display-box {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .code-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .code-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .code-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .modal-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-btn-primary:hover {
            opacity: 0.9;
        }
        .modal-btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        .modal-btn-secondary:hover {
            background: #e0e0e0;
        }
        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .copy-btn:hover {
            background: #45a049;
        }
        .trainers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .trainer-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .trainer-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .trainer-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .trainer-card h3 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .trainer-card p {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .card-phases { border-top: 4px solid #667eea; }
        .card-choice { border-top: 4px solid #f093fb; }
        .card-input { border-top: 4px solid #4facfe; }
        .card-simple { border-top: 4px solid #43e97b; }
        .card-dictionary { border-top: 4px solid #fa709a; }
        .card-wordslist { border-top: 4px solid #64748b; }
        .card-rules { border-top: 4px solid #8b5cf6; }
        .card-rules-test { border-top: 4px solid #f59e0b; }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .trainers-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="main-page">
    <div class="container">
        <h1>🌙 Тренажеры и другое</h1>
        
        <!-- Статус и управление -->
        <div class="code-buttons">
            <div class="status-indicator status-online" id="statusIndicator">
                <span class="status-dot online" id="statusDot"></span>
                <span id="statusText">Онлайн</span>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Переключить тему">🌙</button>
            <button class="code-btn" id="authBtn" onclick="handleAuthBtn()" style="display:none">Войти</button>
        </div>

        <div class="trainers-grid">
            <a href="phases.html" class="trainer-card card-phases">
                <div class="trainer-icon">📔</div>
                <h3>Тренажер Тетрадь</h3>
            </a>

            <a href="dictionary.html" class="trainer-card card-dictionary">
                <div class="trainer-icon">📚</div>
                <h3>Словарь</h3>
            </a>

            <a href="rules-test.html" class="trainer-card card-rules-test">
                <div class="trainer-icon">📝</div>
                <h3>Тесты по правилам</h3>
            </a>


            <a href="spaced-repetition.html" class="trainer-card card-new-trainer">
                <div class="trainer-icon">🧠</div>
                <h3>Новый тренажёр</h3>
                <p>Интервальное повторение с FSRS</p>
            </a>

            <a href="words-list.html" class="trainer-card card-wordslist">
                <div class="trainer-icon">🗂️</div>
                <h3>ХАБ</h3>
            </a>
        </div>
    </div>



    <script>
        // Auth button handler
        function handleAuthBtn() {
            if (window.auth && window.auth.isLoggedIn()) {
                if (confirm('Выйти из аккаунта?')) {
                    window.auth.logout();
                }
            } else {
                if (window.auth) window.auth.openModal();
            }
        }

        // Listen for auth changes to update button
        window.addEventListener('authChanged', () => {
            const btn = document.getElementById('authBtn');
            if (btn) {
                btn.style.display = '';
                btn.textContent = window.auth && window.auth.isLoggedIn()
                    ? (window.auth.getUserEmail() || 'Выйти')
                    : 'Войти';
            }
        });

        // Инициализация
        window.addEventListener('DOMContentLoaded', () => {
            updateOnlineStatus();
            setTimeout(() => {
                const btn = document.getElementById('authBtn');
                if (btn && window.auth) {
                    btn.style.display = '';
                    btn.textContent = window.auth.isLoggedIn()
                        ? (window.auth.getUserEmail() || 'Выйти')
                        : 'Войти';
                }
            }, 500);
        });

        // Обновление статуса онлайн/офлайн
        function updateOnlineStatus() {
            const indicator = document.getElementById('statusIndicator');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (!indicator || !dot || !text) return;
            
            if (navigator.onLine) {
                // Онлайн
                indicator.className = 'status-indicator status-online';
                dot.className = 'status-dot online';
                text.textContent = 'Онлайн';
            } else {
                // Офлайн
                indicator.className = 'status-indicator status-offline';
                dot.className = 'status-dot offline';
                text.textContent = 'Офлайн';
            }
        }

        // Слушаем изменения статуса
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);


    </script>
</body>
</html>
