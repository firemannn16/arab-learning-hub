    <script>
      // Всегда отправляем фывыфвноследнюю страницу, укуесли есть (кроме случая ?home=1)
      (function() {
        const urlParams = new URLSearchParams(location.search);
        const stayOnHome = urlParams.has('home');
        if (!stayOnHome) {
          const lastPage = localStorage.getItem('arabLastPage');
          if (lastPage && lastPage !== 'index.html') {
            window.location.replace(lastPage);
          }
        }
      })();
    </script>

    <script>
    (async function initFirebaseForStreak() {
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyC2yC_BlLuP3dEzWUlWe57hhI4CezNZCy0",
                authDomain: "arab-learning-hub.firebaseapp.com",
                projectId: "arab-learning-hub",
                storageBucket: "arab-learning-hub.firebasestorage.app",
                messagingSenderId: "377334822830",
                appId: "1:377334822830:web:7cb045a81824741f427a3f"
            };
            
            // Проверяем что Firebase ещё не инициализирован
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            
            const db = firebase.firestore();
            db.settings({
                experimentalForceLongPolling: true,
                useFetchStreams: false
            });
            
            window.firestore = db;
            window.firebaseEnabled = true;
            
            console.log('🔥 Firebase инициализирован на главной');
            
            // Уведомляем streak.js
            window.dispatchEvent(new CustomEvent('firebaseReady'));
        } catch(e) {
            console.warn('Firebase не инициализирован на главной:', e);
            window.firebaseEnabled = false;
        }
    })();
    </script>
    <script src="auth.js"></script>
    <script>
      (function authGuard() {
        document.documentElement.style.display = 'none';
        function waitAndCheck() {
          if (window.auth && window.authUser !== undefined) {
            if (!window.auth.isLoggedIn()) {
              document.documentElement.style.display = '';
              window.auth.openModal();
            } else {
              document.documentElement.style.display = '';
            }
          } else {
            setTimeout(waitAndCheck, 200);
          }
        }
        waitAndCheck();
      })();
    </script>
    
    <style>

        body {

<body class="main-page">
    <div class="container">
        <h1>🌙 Арабские Тренажеры</h1>
        
        <!-- Блок цели/серии -->
        <div class="streak-card" id="streakCard">
            <div class="streak-header">
                <div class="streak-title">
                    🎯 Цель: <span id="streakGoalText">7 дней подряд</span>
                </div>
                <div class="streak-count">🔥 <span id="streakCount">0</span> дней</div>
            </div>
            <div class="streak-days" id="streakDays">
                <!-- Заполняется через JS -->
            </div>
            <div class="streak-progress">
                <span id="streakProgressText">Сегодня: 0/5 слов</span>
                <div class="streak-progress-bar">
                    <div class="streak-progress-fill" id="streakProgressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <!-- Статус и управление -->
        <div class="code-buttons">
            <div class="status-indicator status-online" id="statusIndicator">
                <span class="status-dot online" id="statusDot"></span>
                <span id="statusText">Онлайн</span>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Переключить тему">🌙</button>
            <button class="code-btn" id="authBtn" onclick="handleAuthBtn()" style="display:none">Войти</button>
        </div>

        <div class="trainers-grid">
            <a href="phases.html" class="trainer-card card-phases">
                <div class="trainer-icon">📔</div>
                <h3>Тренажер Тетрадь</h3>
            </a>

            <a href="dictionary.html" class="trainer-card card-dictionary">
                <div class="trainer-icon">📚</div>
                <h3>Словарь</h3>
            </a>

            <a href="rules-test.html" class="trainer-card card-rules-test">
                <div class="trainer-icon">📝</div>
                <h3>Тесты по правилам</h3>
            </a>


            <a href="spaced-repetition.html" class="trainer-card card-new-trainer">
                <div class="trainer-icon">🧠</div>
                <h3>Новый тренажёр</h3>
                <p>Интервальное повторение с FSRS</p>
            </a>

            <a href="words-list.html" class="trainer-card card-wordslist">
                <div class="trainer-icon">🗂️</div>
                <h3>ХАБ</h3>
            </a>
        </div>
    </div>



    <script>
        // Auth button handler
        function handleAuthBtn() {
            if (window.auth && window.auth.isLoggedIn()) {
                if (confirm('Выйти из аккаунта?')) {
                    window.auth.logout();
                }
            } else {
                if (window.auth) window.auth.openModal();
            }
        }

        // Listen for auth changes to update button
        window.addEventListener('authChanged', () => {
            const btn = document.getElementById('authBtn');
            if (btn) {
                btn.style.display = '';
                btn.textContent = window.auth && window.auth.isLoggedIn()
                    ? (window.auth.getUserEmail() || 'Выйти')
                    : 'Войти';
            }
        });

        // Инициализация
        window.addEventListener('DOMContentLoaded', () => {
            updateOnlineStatus();
            setTimeout(() => {
                const btn = document.getElementById('authBtn');
                if (btn && window.auth) {
                    btn.style.display = '';
                    btn.textContent = window.auth.isLoggedIn()
                        ? (window.auth.getUserEmail() || 'Выйти')
                        : 'Войти';
                }
            }, 500);
        });

        // Обновление статуса онлайн/офлайн
        function updateOnlineStatus() {
            const indicator = document.getElementById('statusIndicator');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (!indicator || !dot || !text) return;
            
            if (navigator.onLine) {
                // Онлайн
                indicator.className = 'status-indicator status-online';
                dot.className = 'status-dot online';
                text.textContent = 'Онлайн';
            } else {
                // Офлайн
                indicator.className = 'status-indicator status-offline';
                dot.className = 'status-dot offline';
                text.textContent = 'Офлайн';
            }
        }

        // Слушаем изменения статуса
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Обновление блока цели/серии
        function updateStreakUI() {
            if (typeof getStreakInfo !== 'function') return;
            
            const info = getStreakInfo();
            
            // Обновляем счётчик
            document.getElementById('streakCount').textContent = info.currentStreak;
            
            // Обновляем текст цели
            let goalText = formatGoalText(info.currentGoal);
            document.getElementById('streakGoalText').textContent = goalText;

            // Обновляем прогресс за сегодня
            const progressText = info.todayComplete ? 
                '✅ Сегодня выполнено!' : 
                `Сегодня: ${info.todayWords}/${info.wordsNeeded} слов`;
            document.getElementById('streakProgressText').textContent = progressText;
            
            const progressPercent = Math.min(100, (info.todayWords / info.wordsNeeded) * 100);
            document.getElementById('streakProgressFill').style.width = progressPercent + '%';
            
            // Обновляем дни
            if (typeof getStreakDays === 'function') {
                const days = getStreakDays(7);
                const daysContainer = document.getElementById('streakDays');
                daysContainer.innerHTML = days.map(day => `
                    <div class="streak-day ${day.completed ? 'completed' : ''} ${day.isToday ? 'today' : ''}">
                        <span class="day-num">${day.day}</span>
                        <span class="day-icon">${day.completed ? '✅' : (day.isToday ? '📍' : '☐')}</span>
                    </div>
                `).join('');
            }
        }
        
        // Форматирование текста цели
        function formatGoalText(days) {
            if (days === 7) return '7 дней подряд';
            if (days === 30) return '1 месяц';
            
            const years = Math.floor(days / 360);
            const months = Math.floor((days % 360) / 30);
            
            if (years === 0) {
                // Только месяцы
                return formatMonths(months);
            } else if (months === 0) {
                // Только года
                return formatYears(years);
            } else {
                // Года и месяцы
                return `${formatYears(years)} ${formatMonths(months)}`;
            }
        }
        
        function formatYears(n) {
            if (n === 1) return '1 год';
            if (n >= 2 && n <= 4) return `${n} года`;
            return `${n} лет`;
        }
        
        function formatMonths(n) {
            if (n === 1) return '1 мес.';
            return `${n} мес.`;
        }
        
        // Обновляем при загрузке и при изменении
        window.addEventListener('DOMContentLoaded', updateStreakUI);
        window.addEventListener('streakUpdated', updateStreakUI);
    </script>
</body>
