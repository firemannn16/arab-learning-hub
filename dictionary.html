<script>
/* ===== utils ===== */
function removeArabicDiacritics(text) {
  if (!text) return "";
  return text.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g, "");
}
function normalizeArabic(text) {
  if (!text) return "";
  let t = text.trim();
  t = removeArabicDiacritics(t);
  t = t.replace(/[\u0622\u0623\u0625]/g, "\u0627");
  t = t.replace(/\u0649/g, "\u064A");
  t = t.replace(/[\u0624\u0626]/g, "\u0621");
  t = t.replace(/\u0640/g, "");
  return t;
}
function normalizeRussian(text) {
  if (!text) return "";
  return text.toLowerCase().trim();
}
function isCyrillic(q) {
  return /[\u0400-\u04FF]/.test(q);
}
function escapeHtml(s) {
  if (!s) return "";
  return s.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}
function debounce(fn, ms) {
  let t;
  function wrapped(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  }
  wrapped.cancel = () => clearTimeout(t);
  return wrapped;
}

/* ===== Fuzzy search - Levenshtein distance ===== */
function levenshtein(a, b) {
  const matrix = [];
  for (let i = 0; i <= b.length; i++) {
    matrix[i] = [i];
  }
  for (let j = 0; j <= a.length; j++) {
    matrix[0][j] = j;
  }
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

/* ===== Highlight matched text ===== */
function highlightText(text, query) {
  if (!query || !text) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const qNorm = normalizeRussian(query);
  const tNorm = normalizeRussian(text);
  const idx = tNorm.indexOf(qNorm);
  if (idx === -1) return escaped;
  
  const before = text.substring(0, idx);
  const match = text.substring(idx, idx + query.length);
  const after = text.substring(idx + query.length);
  
  return escapeHtml(before) + '<span class="highlight">' + escapeHtml(match) + '</span>' + escapeHtml(after);
}

/* ===== parser & data ===== */
function parseWordText(txt) {
  const lines = txt.split(/\r?\n/);
  const parsed = [];
  let id = 1;
  for (const raw of lines) {
    let line = raw.trim();
    // Нормализуем тире: любые варианты → дефис, затем ставим пробелы вокруг
    line = line.replace(/[\u2010-\u2015–—−]+/g, '-');
    line = line.replace(/\s*-\s*/g, ' - ');
    if (!line || line.startsWith("#")) continue;
    let ru = "", gloss = "", arabicVariants = [], note = "";

    // Parse format with pipes: ru|gloss|ar1|ar2|ar3|note
    if (line.includes("|")) {
      const parts = line.split("|").map(s => s.trim());
      ru = parts[0] || "";
      gloss = parts[1] || "";
      // Collect all arabic variants (from index 2 onwards, except last if it's a note)
      for (let i = 2; i < parts.length; i++) {
        const part = parts[i];
        // Check if it's likely a note (starts with lowercase latin or #)
        if (i === parts.length - 1 && part && /^[a-z#]/.test(part)) {
          note = part;
        } else if (part) {
          arabicVariants.push(part);
        }
      }
    } 
    // Parse format with dashes: ru - ar1 - ar2 - ar3
    else if (line.includes(" - ")) {
      const parts = line.split(" - ").map(s => s.trim());
      const m = parts[0].match(/^(.+?)\s*\((.+)\)\s*$/);
      if (m) { 
        ru = m[1].trim(); 
        gloss = m[2].trim(); 
      } else { 
        ru = parts[0]; 
      }
      // All remaining parts are arabic variants
      for (let i = 1; i < parts.length; i++) {
        if (parts[i]) {
          arabicVariants.push(parts[i]);
        }
      }
    } 
    // Tab separated
    else {
      const p = line.split(/\t+/).map(s => s.trim());
      ru = p[0] || line;
      for (let i = 1; i < p.length; i++) {
        if (p[i]) arabicVariants.push(p[i]);
      }
    }

    parsed.push({
      id: id++,
      ru, 
      gloss, 
      arabicVariants,  // Array of all arabic variants
      note,
      _arabic_norm: arabicVariants.map(normalizeArabic),
      _ru_norm: normalizeRussian(ru + (gloss ? ` (${gloss})` : ""))
    });
  }
  return parsed;
}

let entries = [];

let lastResults = [];      
let renderLimit = 200;     
let currentRenderCount = 0;

// Виртуализация
const ITEM_HEIGHT = 80;     // Примерная высота одного элемента с gap
const BUFFER_SIZE = 5;      // Буфер элементов сверху/снизу
let virtualStartIndex = 0;
let virtualEndIndex = 0;
let scrollTimeout = null;

/* ===== rendering с виртуализацией ===== */
function renderListPartial(list, limit = renderLimit, query = "") {
  lastResults = list;
  lastQuery = query;
  countEl.textContent = "Найдено: " + list.length;

  const totalHeight = list.length * ITEM_HEIGHT;
  resultsEl.style.height = totalHeight + "px";
  
  // Сбрасываем кеш виртуализации — данные изменились, нужна перерисовка
  virtualStartIndex = -1;
  virtualEndIndex = -1;
  
  // Рендерим видимые элементы
  renderVisibleItems();
}

function renderVisibleItems() {
  if (lastResults.length === 0) {
    resultsEl.innerHTML = "";
    return;
  }
  
  const container = document.getElementById("resultsContainer");
  const scrollTop = container.scrollTop;
  const containerHeight = container.clientHeight;
  
  // Определяем какие элементы видны
  const startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER_SIZE);
  const endIndex = Math.min(
    lastResults.length,
    Math.ceil((scrollTop + containerHeight) / ITEM_HEIGHT) + BUFFER_SIZE
  );
  
  // Если диапазон не изменился - не перерисовываем
  if (startIndex === virtualStartIndex && endIndex === virtualEndIndex) {
    return;
  }
  
  virtualStartIndex = startIndex;
  virtualEndIndex = endIndex;
  
  // Очищаем и рендерим только видимые элементы
  resultsEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  
  for (let i = startIndex; i < endIndex; i++) {
    const r = lastResults[i];
    const li = document.createElement("li");
    li.className = "item";
    li.tabIndex = 0;
    li.style.position = "absolute";
    li.style.top = (i * ITEM_HEIGHT) + "px";
    li.style.left = "0";
    li.style.right = "0";
    
    // Join all arabic variants: em dash for display, regular dash for storage
    const allArabicDisplay = r.arabicVariants.join(" — ");
    const allArabicRaw = r.arabicVariants.join(" - ");
    const rawLine = `${r.ru}${r.gloss ? ' (' + r.gloss + ')' : ''} - ${allArabicRaw}`;
    const isFav = typeof isFavorite === "function" && isFavorite(rawLine);
    
    // Highlight russian text if query matches
    let ruDisplay = r.ru;
    if (lastQuery && isCyrillic(lastQuery)) {
      ruDisplay = highlightText(r.ru, lastQuery);
    } else {
      ruDisplay = escapeHtml(r.ru);
    }
    
    const isEdited = pendingEdits[r.id];
    li.innerHTML = `<div style="flex:1">
                      <div class="ru">${ruDisplay}${r.gloss ? ' <small>(' + escapeHtml(r.gloss) + ')</small>' : ''}</div>
                      <div class="ar">${escapeHtml(allArabicDisplay)}${isEdited ? ' <span style="font-size:11px;color:#f59e0b;font-weight:600">[ред.]</span>' : ''}</div>
                    </div>
                    <div class="word-actions">
                      <button class="star-btn ${isFav ? 'active' : ''}" data-raw="${escapeHtml(rawLine).replace(/"/g,'&quot;')}" title="${isFav ? 'Убрать из избранного' : 'В избранное'}" onclick="onDictStarClick(event, this)">${isFav ? '⭐' : '☆'}</button>
                      <div style="font-size:13px;color:#64748b;margin-left:2px">→</div>
                    </div>`;
    li.addEventListener("click", () => openModal(r));
    frag.appendChild(li);
  }
  
  resultsEl.appendChild(frag);
}

// Обработчик скролла с debounce
function onScroll() {
  if (scrollTimeout) {
    clearTimeout(scrollTimeout);
  }
  scrollTimeout = setTimeout(() => {
    renderVisibleItems();
  }, 16); // ~60fps
}

function appendMore(list, add = renderLimit, query = "") {

    const isFav = typeof isFavorite === "function" && isFavorite(rawLine);

                      <div class="ar">${escapeHtml(allArabicDisplay)}${isEdited ? ' <span style="font-size:11px;color:#f59e0b;font-weight:600">[ред.]</span>' : ''}</div>
                    </div>
                    <div class="word-actions">
                      <button class="star-btn ${isFav ? 'active' : ''}" data-raw="${escapeHtml(rawLine).replace(/"/g,'&quot;')}" title="${isFav ? 'Убрать из избранного' : 'В избранное'}" onclick="onDictStarClick(event, this)">${isFav ? '⭐' : '☆'}</button>
                      <div style="font-size:13px;color:#64748b;margin-left:2px">→</div>

// Переключение избранного в списке
window.onDictStarClick = function(e, btn) {
  e.stopPropagation();
  const raw = btn.getAttribute('data-raw') || '';
  const nowFav = typeof toggleFavorite === 'function' && toggleFavorite(raw);

/* ===== search logic with prioritization & fuzzy ===== */
function performSearch(q) {
  const qq = q.trim();
  if (qq === lastQuery) return lastResults;
  lastQuery = qq;
  if (!qq) {
    lastResults = entries.slice();
    return lastResults;
  }

  const qRu = normalizeRussian(qq);
  const qAr = normalizeArabic(qq);
  const useCyr = isCyrillic(qq);

  // Results with priorities
  const exactStart = [];
  const exactMatch = [];
  const fuzzyMatch = [];

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    let matched = false;
    let priority = 0;

    if (useCyr) {
      // Russian search
      if (e._ru_norm.startsWith(qRu)) {
        exactStart.push(e);
        matched = true;
      } else if (e._ru_norm.includes(qRu)) {
        exactMatch.push(e);
        matched = true;
      } else {
        // Fuzzy match for Russian
        const dist = levenshtein(qRu, e._ru_norm.substring(0, qRu.length + 2));
        if (dist <= 2 && qRu.length > 2) {
          fuzzyMatch.push(e);
          matched = true;
        }
      }
    } else {
      // Arabic search
      let foundInArabic = false;
      for (let j = 0; j < e._arabic_norm.length; j++) {
        const arNorm = e._arabic_norm[j];
        if (arNorm.startsWith(qAr)) {
          exactStart.push(e);
          foundInArabic = true;
          break;
        } else if (arNorm.includes(qAr)) {
          exactMatch.push(e);
          foundInArabic = true;
          break;
        } else if (e.arabicVariants[j] && e.arabicVariants[j].includes(qq)) {
          // Direct match with diacritics
          exactMatch.push(e);
          foundInArabic = true;
          break;
        }
      }
      
      if (!foundInArabic) {
        // Try Russian as fallback
        if (e._ru_norm.includes(qRu)) {
          exactMatch.push(e);
          foundInArabic = true;
        }
      }
      
      if (!foundInArabic && qAr.length > 2) {
        // Fuzzy for Arabic
        for (let j = 0; j < e._arabic_norm.length; j++) {
          const dist = levenshtein(qAr, e._arabic_norm[j].substring(0, qAr.length + 2));
          if (dist <= 2) {
            fuzzyMatch.push(e);
            break;
          }
        }
      }
    }
  }

  lastResults = [...exactStart, ...exactMatch, ...fuzzyMatch];
  return lastResults;
}

/* ===== Autocomplete ===== */
function showAutocomplete(suggestions) {
  if (suggestions.length === 0) {
    autocompleteEl.style.display = "none";
    return;
  }
  
  autocompleteEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  
  // Кнопка закрытия
  const closeRow = document.createElement("div");
  closeRow.className = "autocomplete-close";
  closeRow.innerHTML = '<button type="button" aria-label="Закрыть">&times;</button>';
  closeRow.querySelector("button").addEventListener("click", (e) => {
    e.stopPropagation();
    autocompleteEl.style.display = "none";
  });
  frag.appendChild(closeRow);
  
  for (let i = 0; i < Math.min(suggestions.length, 5); i++) {
    const s = suggestions[i];
    const div = document.createElement("div");
    div.className = "autocomplete-item";
    div.textContent = s.ru + (s.gloss ? ` (${s.gloss})` : "");
    div.addEventListener("click", () => {
      qEl.value = s.ru;
      autocompleteEl.style.display = "none";
      doSearchDebounced.cancel();
      const list = performSearch(s.ru);
      renderListPartial(list, renderLimit, s.ru);
    });
    frag.appendChild(div);
  }
  
  autocompleteEl.appendChild(frag);
  autocompleteEl.style.display = "block";
}

        <button id="modalFav" class="btn" title="${favState ? 'Убрать из избранного' : 'В избранное'}">${favState ? '⭐' : '☆'}</button>
        <button id="editBtn" class="btn" title="Редактировать">✏️</button>

  </div>`;

    } catch(e) {

function closeModal() { 
  modalEl.style.display = "none"; 
  modalEl.innerHTML = ""; 
}

function showTemporaryNotify(text) {
  notifyEl.textContent = text;
  notifyEl.style.display = "block";

/* ===== GitHub Token Management ===== */
const GH_TOKEN_KEY = 'github_token';
const GH_REPO = 'firemannn16/arab-learning-hub';
const GH_BRANCH = 'main';
const GH_PATH = 'words.txt';
let pendingEdits = {};
const STORAGE_EDITS_KEY = 'dict_edits';

function getGitHubToken() {
  return localStorage.getItem(GH_TOKEN_KEY) || '';
}

function saveGitHubToken(token) {
  localStorage.setItem(GH_TOKEN_KEY, token);
}

function base64Encode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

/* ===== Edits persistence ===== */
function loadEditsFromStorage() {
  try {
    const stored = localStorage.getItem(STORAGE_EDITS_KEY);
    if (stored) pendingEdits = JSON.parse(stored);
  } catch(e) { pendingEdits = {}; }
}

function saveEditsToStorage() {
  try {
    localStorage.setItem(STORAGE_EDITS_KEY, JSON.stringify(pendingEdits));
  } catch(e) {}
}

function applyPendingEdits() {
  loadEditsFromStorage();
  for (const entry of entries) {
    const edit = pendingEdits[entry.id];
    if (edit) {
      entry.ru = edit.ru;
      entry.gloss = edit.gloss;
      entry.arabicVariants = edit.arabicVariants.slice();
      entry.note = edit.note || '';
      entry._arabic_norm = entry.arabicVariants.map(normalizeArabic);
      entry._ru_norm = normalizeRussian(entry.ru + (entry.gloss ? ` (${entry.gloss})` : ''));
    }
  }
}

function saveWordEdit(id, ru, gloss, arabicVariants, note) {
  pendingEdits[id] = { ru, gloss, arabicVariants: arabicVariants.slice(), note: note || '' };
  saveEditsToStorage();
  const entry = entries.find(e => e.id === id);
  if (entry) {
    entry.ru = ru;
    entry.gloss = gloss;
    entry.arabicVariants = arabicVariants.slice();
    entry.note = note || '';
    entry._arabic_norm = entry.arabicVariants.map(normalizeArabic);
    entry._ru_norm = normalizeRussian(entry.ru + (entry.gloss ? ` (${entry.gloss})` : ''));
  }
}

function rebuildWordsTxt() {
  return entries.map(e => {
    const ruPart = e.ru + (e.gloss ? ` (${e.gloss})` : '');
    const arPart = e.arabicVariants.join(' - ');
    return `${ruPart} - ${arPart}`;
  }).join('\n');
}

async function updateWordOnGitHub(entry, isRevert) {
  const token = getGitHubToken();
  if (!token) {
    showTemporaryNotify('Введите GitHub токен в настройках');
    return false;
  }
  try {
    const getUrl = `https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`;
    const getRes = await fetch(getUrl, {
      headers: { 'Authorization': `token ${token}` }
    });
    if (!getRes.ok) throw new Error(`Ошибка GET ${getRes.status}`);
    const fileData = await getRes.json();
    const sha = fileData.sha;

    const updatedContent = rebuildWordsTxt();
    const label = isRevert
      ? `Отменено: ${entry.ru} — ${entry.arabicVariants.join(', ')}`
      : `Исправлено: ${entry.ru} — ${entry.arabicVariants.join(', ')}`;

    const putUrl = `https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`;
    const putRes = await fetch(putUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: label,
        content: base64Encode(updatedContent),
        sha: sha,
        branch: GH_BRANCH
      })
    });
    if (!putRes.ok) throw new Error(`Ошибка PUT ${putRes.status}`);
    if (isRevert) delete pendingEdits[entry.id];
    else saveEditsToStorage();
    return true;
  } catch(e) {
    console.error('GitHub API error:', e);
    showTemporaryNotify('Ошибка GitHub: ' + e.message);
    return false;
  }
}

/* ===== Edit mode in modal ===== */
function enableEditMode(item) {
  const card = document.querySelector('.card');
  if (!card) return;

  const ru = item.ru;
  const gloss = item.gloss || '';
  const arabicJoined = item.arabicVariants.join(' - ');
  const note = item.note || '';

  card.innerHTML = `
    <button id="closeEditBtn" style="float:right" class="btn">← Назад</button>
    <h3 style="margin-top:4px">Редактирование</h3>
    <div style="margin-top:12px">
      <label style="display:block;font-size:12px;color:#64748b;margin-bottom:2px">Русский:</label>
      <input id="editRu" value="${escapeHtml(ru)}" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:15px;box-sizing:border-box">
    </div>
    <div style="margin-top:8px">
      <label style="display:block;font-size:12px;color:#64748b;margin-bottom:2px">Пояснение (gloss):</label>
      <input id="editGloss" value="${escapeHtml(gloss)}" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:15px;box-sizing:border-box">
    </div>
    <div style="margin-top:8px">
      <label style="display:block;font-size:12px;color:#64748b;margin-bottom:2px">Арабские варианты (через пробел - тире - пробел):</label>
      <input id="editArabic" value="${escapeHtml(arabicJoined)}" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:15px;box-sizing:border-box" dir="rtl">
    </div>
    <div style="margin-top:8px">
      <label style="display:block;font-size:12px;color:#64748b;margin-bottom:2px">Примечание:</label>
      <input id="editNote" value="${escapeHtml(note)}" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:15px;box-sizing:border-box">
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button id="saveEditBtn" class="btn" style="background:#0f172a;color:#fff;border-color:#0f172a">💾 Сохранить в GitHub</button>
      <button id="cancelEditBtn" class="btn">Отмена</button>
    </div>
  `;

  document.getElementById('closeEditBtn').addEventListener('click', () => openModal(item));
  document.getElementById('cancelEditBtn').addEventListener('click', () => openModal(item));
  document.getElementById('saveEditBtn').addEventListener('click', async () => {
    const newRu = document.getElementById('editRu').value.trim();
    const newGloss = document.getElementById('editGloss').value.trim();
    const newArabic = document.getElementById('editArabic').value.trim();
    const newNote = document.getElementById('editNote').value.trim();

    if (!newRu || !newArabic) {
      showTemporaryNotify('Заполните русский и арабский текст');
      return;
    }

    const arabicParts = newArabic.split(/\s*[-–—]\s*/).filter(s => s.trim());

    const btn = document.getElementById('saveEditBtn');
    btn.textContent = '⏳ Сохраняю...';
    btn.disabled = true;

    const updatedEntry = {
      ...item,
      ru: newRu,
      gloss: newGloss,
      arabicVariants: arabicParts,
      note: newNote
    };

    const ok = await updateWordOnGitHub(updatedEntry, false);
    if (ok) {
      saveWordEdit(item.id, newRu, newGloss, arabicParts, newNote);
      showTemporaryNotify('Сохранено в GitHub');
      closeModal();
      renderListPartial(lastResults.length ? performSearch(lastQuery) : entries, renderLimit, lastQuery);
    } else {
      btn.textContent = '💾 Сохранить в GitHub';
      btn.disabled = false;
    }
  });
}

/* ===== Settings panel ===== */
document.getElementById('settingsBtn').addEventListener('click', () => {
  const panel = document.getElementById('settingsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  document.getElementById('ghTokenInput').value = getGitHubToken();
});

document.getElementById('ghTokenSaveBtn').addEventListener('click', () => {
  const token = document.getElementById('ghTokenInput').value.trim();
  const status = document.getElementById('ghTokenStatus');
  if (!token) {
    status.textContent = 'Введите токен';
    status.style.color = '#ef4444';
    return;
  }
  saveGitHubToken(token);
  status.textContent = 'Токен сохранен';
  status.style.color = '#10b981';
  setTimeout(() => {
    document.getElementById('settingsPanel').style.display = 'none';
  }, 1000);
});

/* ===== loading and init ===== */
async function loadFromServer() {
  try {
    const res = await fetch("words.txt", { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    const txt = await res.text();
    entries = parseWordText(txt);
    lastQuery = "";
    lastResults = entries.slice();
    renderListPartial(lastResults);
    statusHint.style.display = "none";
  } catch (e) {
    console.warn("Не удалось загрузить words.txt:", e);
    statusHint.textContent = "Не удалось загрузить words.txt — загружены примеры.";
    statusHint.style.display = "block";
    const fallback = [
      "дом|house|بَيْت|بيت",
      "писать|to write|كَتَبَ|كتب",
      "идти|to go|مَشَى|يَمْشِي|سَارَ"
    ].join("\n");
    entries = parseWordText(fallback);
    lastQuery = "";
    lastResults = entries.slice();
    renderListPartial(lastResults);
  }
}

/* ===== events ===== */
const doSearchDebounced = debounce(() => {
  const val = qEl.value;
  console.log('Поиск по значению:', val, 'Длина:', val.length);
  const list = performSearch(val);
  console.log('Найдено результатов:', list.length);
  renderListPartial(list, renderLimit, val);
  const sc = document.getElementById("resultsContainer");
  if (sc) sc.scrollTop = 0;
  
  // Update autocomplete
  if (val.trim().length > 1) {
    const suggestions = list.slice(0, 5);
    showAutocomplete(suggestions);
  } else {
    autocompleteEl.style.display = "none";
  }
}, 200);

const clearBtn = document.getElementById("clearBtn");

function updateClearBtn() {
  clearBtn.style.display = qEl.value.length > 0 ? "block" : "none";
}

clearBtn.addEventListener("click", () => {
  qEl.value = "";
  updateClearBtn();
  autocompleteEl.style.display = "none";
  doSearchDebounced.cancel();
  performSearch("");
  renderListPartial([], renderLimit, "");
  qEl.focus();
});

qEl.addEventListener("input", (ev) => {
  console.log('Ввод текста:', qEl.value);
  updateClearBtn();
  doSearchDebounced();
});

qEl.addEventListener("focus", () => {
  if (qEl.value.trim().length > 1 && lastResults.length > 0) {
    showAutocomplete(lastResults.slice(0, 5));
  }
});

qEl.addEventListener("blur", () => {
  setTimeout(() => {
    autocompleteEl.style.display = "none";
  }, 200);
});

showMoreBtn.addEventListener("click", () => {
  const list = lastResults;
  appendMore(list, renderLimit, qEl.value);
});

// Обработчик скролла для виртуализации
document.getElementById("resultsContainer").addEventListener("scroll", onScroll);

qEl.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") {
    // Отменяем отложенный поиск
    doSearchDebounced.cancel();
    // Выполняем поиск сразу
    const val = qEl.value;
    console.log('Enter нажат, выполняем поиск по:', val);
    const list = performSearch(val);
    console.log('Найдено результатов:', list.length);
    renderListPartial(list, renderLimit, val);
    // Закрываем автокомплит
    autocompleteEl.style.display = "none";
    // Скроллим наверх

    if (container) container.scrollTop = 0;
  }
  if (ev.key === "Escape") {
    autocompleteEl.style.display = "none";
  }
});
