  * { margin: 0; padding: 0; box-sizing: border-box; }

  .deck-card-body {

  .dark-theme .deck-stat { color: #e0e0e0; }
  .deck-stat .num-blue { color: #3b82f6; font-weight: 600; }
  .deck-stat .num-red { color: #ef4444; font-weight: 600; }

  .deck-study-btn {

  .dark-theme .deck-study-btn { background: #3b82f6; }

  .deck-settings-btn {

  .dark-theme .deck-settings-btn { color: #64748b; }

  .deck-card-footer {

  /* end deck card */

  /* Responsive */
  @media (max-width: 560px) {

<div class="main-area" id="mainArea">

<div id="settingsModal" class="modal-overlay" style="display:none">

      <input type="number" id="limitNew" min="1" max="200" value="50" style="width:80px;padding:6px;border-radius:8px;border:2px solid #e0e0e0;text-align:center;font-size:1rem">

<script>
(function() {
  'use strict';

  const CARD_STORE_KEY = 'arabSrCards';
  const SETTINGS_KEY = 'arabSrSettings';
  const TODAY_KEY = 'arabSrToday';
  const NEW_TODAY_KEY = 'arabSrNewToday';

  let allWords = [];
  let cards = [];
  let queue = [];
  let currentIndex = 0;
  let isFlipped = false;
  let todayCount = 0;
  let newTodayCount = 0;
  let limitNew = 50;
  let unlimitedReviews = true;
  let fsrs;
  let newCardsLeft = 0;

  // Настройки
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      if (s) {
        if (s.limitNew) limitNew = s.limitNew;
        if (s.unlimitedReviews !== undefined) unlimitedReviews = s.unlimitedReviews;
      }
    } catch(e) {}
  }
  function saveSettingsToStorage() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ limitNew, unlimitedReviews }));
  }

  // Сколько новых показано сегодня
  function loadNewTodayCount() {
    try {
      const d = JSON.parse(localStorage.getItem(NEW_TODAY_KEY));
      if (d && d.date === new Date().toDateString()) newTodayCount = d.count || 0;
      else newTodayCount = 0;
    } catch(e) { newTodayCount = 0; }
  }
  function saveNewTodayCount() {
    localStorage.setItem(NEW_TODAY_KEY, JSON.stringify({ date: new Date().toDateString(), count: newTodayCount }));
  }

  // Сколько всего повторений сегодня
  function loadTodayCount() {
    try {
      const d = JSON.parse(localStorage.getItem(TODAY_KEY));
      if (d && d.date === new Date().toDateString()) todayCount = d.count || 0;
      else todayCount = 0;
    } catch(e) { todayCount = 0; }
  }
  function saveTodayCount() {
    localStorage.setItem(TODAY_KEY, JSON.stringify({ date: new Date().toDateString(), count: todayCount }));
  }

  function loadCardsLocal() {
    try {
      const d = JSON.parse(localStorage.getItem(CARD_STORE_KEY));
      if (d && Array.isArray(d)) return d;
    } catch(e) {}
    return [];
  }
  function saveCardsLocal(data) {
    localStorage.setItem(CARD_STORE_KEY, JSON.stringify(data));
  }

  function wordToId(wordLine) {
    let hash = 0;
    const s = wordLine.trim().toLowerCase();
    for (let i = 0; i < s.length; i++) {
      const ch = s.charCodeAt(i);
      hash = ((hash << 5) - hash) + ch;
      hash = hash & hash;
    }
    return 'w_' + Math.abs(hash).toString(36);
  }

  async function loadCardsFromFirestore() {
    if (!window.firestore || !window.auth || !window.authUser) return null;
    try {
      const uid = window.authUser.uid;
      if (typeof window.firestore.collection === 'function') {
        const snap = await window.firestore.collection('users').doc(uid).collection('sr_cards').doc('all').get();
        if (snap.exists) {
          const data = snap.data();
          return data.cards || null;
        }
      }
      return null;
    } catch(e) {
      console.warn('Firestore load error:', e);
      return null;
    }
  }

  async function saveCardsToFirestore(cardsData) {
    if (!window.firestore || !window.auth || !window.authUser) return;
    try {
      const uid = window.authUser.uid;
      if (typeof window.firestore.collection === 'function') {
        await window.firestore.collection('users').doc(uid).collection('sr_cards').doc('all').set({
          cards: cardsData,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      }
    } catch(e) {
      console.warn('Firestore save error:', e);
    }
  }

  function initCard(wordLine, existingCardsMap) {
    const id = wordToId(wordLine);
    const existing = existingCardsMap[id];
    if (existing) return existing;
    const match = wordLine.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (!match) return null;
    return {
      id,
      ru: match[1].trim(),
      ar: match[2].trim(),
      line: wordLine,
      ...window.FSRS_defaultCard()
    };
  }

  async function init() {
    loadSettings();
    loadTodayCount();
    loadNewTodayCount();
    fsrs = new window.FSRS();
    fsrs.maxInterval = 180; // полгода

    try {
      const resp = await fetch('words.txt');
      const text = await resp.text();
      const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#') && /[-–—]/.test(l));
      if (lines.length === 0) throw new Error('No words');
      allWords = lines;
    } catch(e) {
      document.getElementById('mainArea').innerHTML = '<div class="done-state"><div class="icon">❌</div><h2>Не удалось загрузить слова</h2><p>Проверьте файл words.txt</p></div>';
      return;
    }

    let storedCards = loadCardsLocal();
    if (window.auth && window.authUser) {
      const remote = await loadCardsFromFirestore();
      if (remote && remote.length > 0) {
        if (storedCards.length === 0) {
          storedCards = remote;
        } else {
          const remoteMap = {};
          remote.forEach(c => { remoteMap[c.id] = c; });
          const localMap = {};
          storedCards.forEach(c => { localMap[c.id] = c; });
          const merged = [];
          const seen = new Set();
          [...remote, ...storedCards].forEach(c => {
            if (seen.has(c.id)) return;
            seen.add(c.id);
            const r = remoteMap[c.id];
            const l = localMap[c.id];
            if (r && l) {
              merged.push((r.lastReview || 0) > (l.lastReview || 0) ? r : l);
            } else {
              merged.push(r || l);
            }
          });
          storedCards = merged;
        }
      }
      saveCardsLocal(storedCards);
    }

    const cardMap = {};
    storedCards.forEach(c => { cardMap[c.id] = c; });

    cards = [];
    allWords.forEach(line => {
      const card = initCard(line, cardMap);
      if (card) cards.push(card);
    });

    saveCardsLocal(cards);
    if (window.auth && window.authUser) saveCardsToFirestore(cards);

    renderDeckSelection();
  }

  // Построение очереди как в Anki:
  // 1) Изучаемые (learning) — в процессе
  // 2) Повторяемые (review) — у кого due ≤ сейчас
  // 3) Новые — до лимита
  function buildQueue() {
    const now = Date.now();
    newCardsLeft = Math.max(0, limitNew - newTodayCount);

    const learningCards = [];
    const reviewCards = [];
    const newCards = [];

    cards.forEach(c => {
      if (c.state === window.FSRS_STATE.NEW) {
        newCards.push(c);
      } else if (c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING) {
        learningCards.push(c);
      } else if (c.state === window.FSRS_STATE.REVIEW) {
        if (!c.due || c.due <= now) {
          reviewCards.push(c);
        }
      }
    });

    // Изучаемые — в порядке очереди (по due)
    learningCards.sort((a, b) => (a.due || now) - (b.due || now));
    // Повторяемые — самые просроченные первые
    reviewCards.sort((a, b) => (a.due || now) - (b.due || now));
    // Новые — перемешать
    for (let i = newCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newCards[i], newCards[j]] = [newCards[j], newCards[i]];
    }

    queue = [
      ...learningCards,
      ...reviewCards,
      ...newCards.slice(0, newCardsLeft)
    ];
    currentIndex = 0;
  }

  function getStats() {
    const now = Date.now();
    const total = cards.length;
    const newCount = cards.filter(c => c.state === window.FSRS_STATE.NEW).length;
    const learningCount = cards.filter(c => c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING).length;
    const reviewDue = cards.filter(c => c.state === window.FSRS_STATE.REVIEW && (!c.due || c.due <= now)).length;
    return { total, new: newCount, learning: learningCount, due: reviewDue, today: todayCount };
  }

  function renderDeckSelection() {
    const area = document.getElementById('mainArea');
    const stats = getStats();
    area.innerHTML = `
      <div class="deck-card">
        <div class="deck-card-title">По умолчанию</div>
        <div class="deck-card-body">
          <div class="deck-stats">
            <div class="deck-stat">Новые: <span class="num-blue">${stats.new}</span></div>
            <div class="deck-stat">Изучаемые: <span class="num-red">${stats.learning}</span></div>
            <div class="deck-stat">Повторяемые: <span class="num-green">${stats.due}</span></div>
            <div class="deck-stat">Всего: <span class="num-gray">${stats.total}</span></div>
          </div>
          <button class="deck-study-btn" id="studyBtn">Учить</button>
        </div>
        <div class="deck-card-footer">
          <button class="deck-settings-btn" id="settingsBtn" title="Настройки">⚙️</button>
        </div>
      </div>
    `;
    document.getElementById('studyBtn').addEventListener('click', () => {
      buildQueue();
      render();
    });
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
  }

  function render() {
    const area = document.getElementById('mainArea');
    const stats = getStats();

    if (queue.length === 0) {
      if (stats.due === 0 && stats.new === 0) {
        area.innerHTML = `
          <div class="done-state">
            <div class="icon">🎉</div>
            <h2>Все слова повторены!</h2>
            <p>На сегодня всё. Возвращайтесь завтра.</p>
            <div style="font-size:0.9rem;color:#94a3b8;margin-top:12px">
              Повторено сегодня: ${stats.today}
            </div>
          </div>
        `;
      } else {
        buildQueue();
        if (queue.length === 0) { setTimeout(render, 1000); return; }
        renderCard();
      }
      return;
    }
    renderCard();
  }

  function renderCard() {
    const area = document.getElementById('mainArea');
    const card = queue[currentIndex];
    if (!card) { render(); return; }
    isFlipped = false;

    const front = card.ar;
    const total = queue.length;
    const pct = total > 0 ? ((currentIndex / total) * 100) : 0;
    const r = fsrs.getRetrievability(card, Date.now());

    // Подпись состояния карты
    let stateLabel = '';
    if (card.state === window.FSRS_STATE.NEW) stateLabel = '🆕 Новая';
    else if (card.state === window.FSRS_STATE.LEARNING) stateLabel = '📖 Изучается';
    else if (card.state === window.FSRS_STATE.RELEARNING) stateLabel = '🔄 Переучивается';
    else if (card.state === window.FSRS_STATE.REVIEW) stateLabel = '🔁 Повторение';

    area.innerHTML = `
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card-container">
        <div class="flashcard" id="flashcard">
          <button class="fav-star ${window.isFavorite ? (window.isFavorite(card.line) ? 'active' : '') : ''}" id="favStar">${window.isFavorite && window.isFavorite(card.line) ? '⭐' : '☆'}</button>
          <div class="word-index">${currentIndex + 1}/${total}</div>
          <div class="front-text arabic" id="frontText">${front}</div>
          <div class="tap-hint" id="tapHint">👆 нажмите, чтобы увидеть перевод</div>
          <div style="position:absolute;bottom:4px;left:16px;font-size:0.65rem;color:#94a3b8">${stateLabel}</div>
        </div>
      </div>
      <div class="ratings hidden" id="ratings">
        <button class="rating-btn rating-again" data-rating="0">Снова<span class="sub">&lt; 1 мин</span></button>
        <button class="rating-btn rating-hard" data-rating="1">Трудно<span class="sub">~10 мин</span></button>
        <button class="rating-btn rating-good" data-rating="2">Хорошо<span class="sub">~1 д</span></button>
        <button class="rating-btn rating-easy" data-rating="3">Лёгко<span class="sub">~3 д</span></button>
      </div>
      ${r !== null ? `<div class="queue-info">Вероятность вспомнить: ${Math.round(r * 100)}%</div>` : ''}
    `;

    document.getElementById('flashcard').addEventListener('click', (e) => {
      if (e.target.closest('.fav-star')) return;
      flipCard(card);
    });

    const favStar = document.getElementById('favStar');
    if (favStar) {
      favStar.addEventListener('click', () => {
        if (window.toggleFavorite) {
          const val = window.toggleFavorite(card.line);
          favStar.textContent = val ? '⭐' : '☆';
          favStar.classList.toggle('active', val);
        }
      });
    }

    area.querySelectorAll('.rating-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const rating = parseInt(btn.dataset.rating);
        handleRating(card, rating);
      });
    });

    // Клавиши 1-4
    document.addEventListener('keydown', function keyHandler(e) {
      if (['1','2','3','4'].includes(e.key)) {
        if (isFlipped) {
          const rating = parseInt(e.key) - 1;
          document.removeEventListener('keydown', keyHandler);
          handleRating(card, rating);
        }
      }
    });
  }

  function flipCard(card) {
    if (isFlipped) return;
    isFlipped = true;
    const back = card.ru;
    document.getElementById('frontText').insertAdjacentHTML('afterend', `<div class="back-text" id="backText">${back}</div>`);
    document.getElementById('tapHint').textContent = '';
    document.getElementById('ratings').classList.remove('hidden');
  }

  function handleRating(card, rating) {
    const now = Date.now();
    const results = fsrs.repeat(card, now);
    const updated = results[rating];

    const idx = cards.findIndex(c => c.id === card.id);
    if (idx !== -1) {
      // Если была новая — считаем в лимит новых
      if (cards[idx].state === window.FSRS_STATE.NEW) {
        newTodayCount++;
        saveNewTodayCount();
      }
      cards[idx] = updated;
    }

    saveCardsLocal(cards);
    if (window.auth && window.authUser) saveCardsToFirestore(cards);

    todayCount++;
    saveTodayCount();

    queue.splice(currentIndex, 1);
    render();
  }

  // Настройки
  function openSettings() {
    const modal = document.getElementById('settingsModal');
    document.getElementById('limitNew').value = limitNew;
    document.getElementById('unlimitedReviews').checked = unlimitedReviews;
    modal.style.display = 'flex';
  }

  document.getElementById('settingsSaveBtn').addEventListener('click', () => {
    limitNew = parseInt(document.getElementById('limitNew').value) || 50;
    unlimitedReviews = document.getElementById('unlimitedReviews').checked;
    saveSettingsToStorage();
    document.getElementById('settingsModal').style.display = 'none';
    buildQueue();
    render();
  });
  document.getElementById('settingsModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.target.style.display = 'none';
  });

  // Синхронизация при смене auth
  window.addEventListener('authChanged', async () => {
    if (window.authUser && cards.length > 0) {
      const remote = await loadCardsFromFirestore();
      if (remote && remote.length > 0) {
        const remoteMap = {};
        remote.forEach(c => { remoteMap[c.id] = c; });
        let changed = false;
        cards.forEach((c, i) => {
          if (remoteMap[c.id]) {
            const r = remoteMap[c.id];
            if ((r.lastReview || 0) > (c.lastReview || 0)) {
              cards[i] = r;
              changed = true;
            }
          }
        });
        if (changed) {
          saveCardsLocal(cards);
          buildQueue();
          render();
        }
      }
      saveCardsToFirestore(cards);
    } else if (!window.authUser && cards.length === 0) {
      init();
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
