<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интервальное повторение - Арабские слова</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <script src="dua.js"></script>
  <script src="service-worker-register.js"></script>
  <script src="sidebar-menu.js"></script>
  <script src="favorites.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

          firebase.initializeApp({
            apiKey: "AIzaSyC2yC_BlLuP3dEzWUlWe57hhI4CezNZCy0",
            authDomain: "arab-learning-hub.firebaseapp.com",
            projectId: "arab-learning-hub",
            storageBucket: "arab-learning-hub.firebasestorage.app",

  <script src="fsrs.js"></script>
  <script src="auth.js"></script>
  <script>
    (function authGuard() {
      document.documentElement.style.display = 'none';
      function waitAndCheck() {
        if (window.auth && window.authUser !== undefined) {
          if (!window.auth.isLoggedIn()) {
            document.documentElement.style.display = '';
            window.auth.openModal();
          } else {
            document.documentElement.style.display = '';
          }
        } else {
          setTimeout(waitAndCheck, 200);
        }
      }
      waitAndCheck();
    })();
  </script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f7fa; color: #1f2937;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .dark-theme body { background: #1a1a2e; color: #e0e0e0; }

  /* Main card area */
  .main-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; padding: 20px 20px 100px; min-height: 100vh; position: relative;
  }
  .card-container {
    width: 100%; max-width: 500px; perspective: 1000px;
  }
  .flashcard {
    position: relative; width: 100%;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    padding: 40px 24px;
    text-align: center; cursor: pointer;
    min-height: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: box-shadow 0.3s;
    user-select: none;
  }
  .dark-theme .flashcard { background: #1e293b; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .flashcard:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
  .dark-theme .flashcard:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.4); }

  .flashcard .front-text {
    font-size: 2rem; font-weight: 600; line-height: 1.4;
    word-break: break-word; width: 100%;
  }
  .flashcard .front-text.arabic { direction: rtl; font-size: 2.5rem; }
  .dark-theme .flashcard .front-text { color: #e0e0e0; }

  .flashcard .back-text {
    font-size: 2rem; font-weight: 600; line-height: 1.4;
    word-break: break-word; width: 100%;
    margin-top: 20px; padding-top: 20px;
    border-top: 2px solid #e0e0e0;
  }
  .dark-theme .flashcard .back-text { border-top-color: #334155; color: #e0e0e0; }
  .flashcard .back-text.arabic { direction: rtl; font-size: 2.5rem; }

  .flashcard .tap-hint {
    position: absolute; bottom: 16px;
    font-size: 0.8rem; color: #999;
  }
  .dark-theme .flashcard .tap-hint { color: #64748b; }

  .flashcard .card-note {
    margin-top: 12px; padding: 16px 20px;
    border: 1.5px solid #e5b8b8; border-radius: 14px;
    background: #fff7f7; width: 100%; word-break: break-word;
    font-size: 0.85rem; line-height: 1.6; display: flex; gap: 12px;
  }
  .flashcard .card-note .note-label {
    color: #c0392b; font-weight: 700; font-size: 1rem; flex-shrink: 0;
  }
  .flashcard .card-note .note-text {
    color: #1f2937; flex: 1;
  }
  .dark-theme .flashcard .card-note { background: #2a1a1a; border-color: #5a3a3a; }
  .dark-theme .flashcard .card-note .note-label { color: #e57373; }
  .dark-theme .flashcard .card-note .note-text { color: #e0e0e0; }

  .flashcard .word-index {
    position: absolute; top: 12px; right: 16px;
    font-size: 0.75rem; color: #bbb;
  }
  .dark-theme .flashcard .word-index { color: #475569; }

  .flashcard .fav-star {
    position: absolute; top: 8px; left: 16px;
    background: none; border: none;
    font-size: 1.5rem; cursor: pointer; opacity: 0.4;
    transition: opacity 0.2s;
  }
  .flashcard .fav-star:hover { opacity: 1; }
  .flashcard .fav-star.active { opacity: 1; }

  /* Rating buttons */
  .ratings {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; max-width: 500px; width: 100%; margin-top: 20px;
  }
  .rating-btn {
    padding: 14px 6px; border: none; border-radius: 12px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    text-align: center; line-height: 1.2;
  }
  .rating-btn:hover { transform: translateY(-2px); }
  .rating-btn:active { transform: translateY(0); }
  .rating-btn .sub { font-size: 0.7rem; font-weight: 400; opacity: 0.8; display: block; margin-top: 2px; }

  .rating-again { background: #fee2e2; color: #dc2626; }
  .rating-again:hover { box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
  .dark-theme .rating-again { background: #451a1a; color: #fca5a5; }

  .rating-hard { background: #fed7aa; color: #ea580c; }
  .rating-hard:hover { box-shadow: 0 4px 12px rgba(234,88,12,0.3); }
  .dark-theme .rating-hard { background: #431407; color: #fdba74; }

  .rating-good { background: #bbf7d0; color: #16a34a; }
  .rating-good:hover { box-shadow: 0 4px 12px rgba(22,163,74,0.3); }
  .dark-theme .rating-good { background: #052e16; color: #86efac; }

  .rating-easy { background: #bfdbfe; color: #2563eb; }
  .rating-easy:hover { box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .dark-theme .rating-easy { background: #172554; color: #93c5fd; }

  .ratings.hidden { display: none; }

  /* Done state */
  .done-state {
    text-align: center; padding: 60px 20px;
  }
  .done-state .icon { font-size: 4rem; margin-bottom: 16px; }
  .done-state h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .done-state p { color: #666; margin-bottom: 20px; }
  .dark-theme .done-state p { color: #94a3b8; }

  /* Queue info */
  .queue-info {
    max-width: 500px; width: 100%; margin-top: 12px;
    font-size: 0.8rem; color: #94a3b8; text-align: center;
  }

  /* Loading */
  .loading-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px;
  }
  .loading-spinner {
    width: 40px; height: 40px;
    border: 4px solid #e2e8f0; border-top-color: #667eea;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dark-theme .loading-spinner { border-color: #334155; border-top-color: #667eea; }

  /* Progress bar */
  .progress-track {
    max-width: 500px; width: 100%; height: 4px;
    background: #e2e8f0; border-radius: 2px; margin-bottom: 16px;
    overflow: hidden;
  }
  .dark-theme .progress-track { background: #334155; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 2px; transition: width 0.3s;
  }

  /* Deck selection card */
  .deck-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 22px 24px;
    width: 100%;
    max-width: 480px;
  }
  .dark-theme .deck-card { background: #1e293b; border-color: #334155; }
  .deck-card-title {
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 20px;
    color: #1f2937;
  }
  .dark-theme .deck-card-title { color: #e0e0e0; }
  .deck-card-body {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }
  .deck-stats {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .deck-stat {
    font-size: 0.9rem;
    color: #1f2937;
  }
  .dark-theme .deck-stat { color: #e0e0e0; }
  .deck-stat .num-blue { color: #3b82f6; font-weight: 600; }
  .deck-stat .num-red { color: #ef4444; font-weight: 600; }
  .deck-stat .num-green { color: #22c55e; font-weight: 600; }
  .deck-study-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .deck-study-btn:hover { background: #1d4ed8; transform: scale(1.03); }
  .deck-study-btn:active { transform: scale(0.97); }
  .dark-theme .deck-study-btn { background: #3b82f6; }
  .dark-theme .deck-study-btn:hover { background: #2563eb; }
  .deck-stat .num-gray { color: #6b7280; font-weight: 600; }
  .deck-settings-btn {
    background: none; border: none;
    font-size: 1.15rem; color: #9ca3af; cursor: pointer;
    padding: 4px; line-height: 1;
    transition: color 0.2s;
  }
  .deck-settings-btn:hover { color: #4b5563; }
  .dark-theme .deck-settings-btn { color: #64748b; }
  .dark-theme .deck-settings-btn:hover { color: #94a3b8; }

  /* Settings limit rows */
  .setting-row { margin-bottom: 16px; }
  .setting-label { font-size: 0.9rem; color: #1f2937; margin-bottom: 6px; }
  .dark-theme .setting-label { color: #e0e0e0; }
  .setting-limit-info {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85rem; color: #6b7280; margin-bottom: 4px;
  }
  .dark-theme .setting-limit-info { color: #94a3b8; }
  .setting-limit-remaining { font-weight: 600; color: #2563eb; }
  .dark-theme .setting-limit-remaining { color: #60a5fa; }
  .setting-exhausted {
    background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .dark-theme .setting-exhausted { background: #450a0a; border-color: #7f1d1d; }
  .setting-exhausted-text {
    font-size: 0.8rem; color: #dc2626; margin-bottom: 6px;
  }
  .dark-theme .setting-exhausted-text { color: #fca5a5; }
  .setting-exhausted-row {
    display: flex; justify-content: space-between; align-items: center;
  }
  .setting-timer {
    font-size: 0.8rem; font-weight: 600; color: #dc2626; font-variant-numeric: tabular-nums;
  }
  .dark-theme .setting-timer { color: #fca5a5; }
  .setting-boost-btn {
    padding: 5px 12px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  .setting-boost-btn:hover { background: #1d4ed8; }

  /* Boost modal */
  .boost-input-row {
    display: flex; gap: 8px; align-items: center; margin: 16px 0;
  }
  .boost-input-row input {
    flex: 1; padding: 10px 12px; border-radius: 8px;
    border: 2px solid #d1d5db; font-size: 1rem; text-align: center;
  }
  .dark-theme .boost-input-row input {
    background: #334155; border-color: #475569; color: #e0e0e0;
  }
  .boost-save-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .limit-btn {
    margin: 4px 4px 0; padding: 6px 14px; border: none;
    border-radius: 6px; background: #667eea; color: #fff;
    font-size: 0.8rem; cursor: pointer; transition: opacity 0.2s;
  }
  .limit-btn:hover { opacity: 0.85; }
  .limit-btn-primary { background: #7c3aed; }

  .deck-card-footer {
    display: flex; justify-content: flex-end; align-items: center;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid #f3f4f6;
  }
  .dark-theme .deck-card-footer { border-top-color: #1e293b; }
  /* end deck card */

  /* Responsive */
  @media (max-width: 560px) {
    .flashcard { padding: 28px 16px; min-height: 220px; }
    .flashcard .front-text { font-size: 1.5rem; }
    .flashcard .front-text.arabic { font-size: 2rem; }
    .flashcard .back-text { font-size: 1.5rem; }
    .flashcard .back-text.arabic { font-size: 2rem; }
    .rating-btn { padding: 12px 4px; font-size: 0.78rem; }
    .main-area { padding: 20px 12px 80px; }
    .ratings { gap: 6px; }
  }

  /* Study back button */
  .study-back-btn {
    position: absolute; top: 14px; left: 12px; z-index: 20;
    background: none; border: none;
    font-size: 1.3rem; color: #94a3b8; cursor: pointer;
    padding: 4px 8px; line-height: 1;
    transition: color 0.2s;
  }
  .study-back-btn:hover { color: #4b5563; }
  .dark-theme .study-back-btn { color: #64748b; }
  .dark-theme .study-back-btn:hover { color: #94a3b8; }

  /* Undo button (top-right, touch-friendly) */
  .undo-btn {
    position: absolute; top: 10px; right: 12px; z-index: 20;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    font-size: 1.4rem; color: #4b5563; cursor: pointer;
    width: 44px; height: 44px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: color 0.2s, opacity 0.2s;
  }
  .undo-btn:hover { color: #1f2937; }
  .undo-btn.undo-disabled { opacity: 0.3; pointer-events: none; }
  .dark-theme .undo-btn { background: #1e293b; border-color: #334155; color: #94a3b8; }
  .dark-theme .undo-btn:hover { color: #e0e0e0; }

  .done-home-btn {
    display: inline-block; margin-top: 24px; padding: 12px 28px;
    background: #4fc3f7; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; cursor: pointer; font-weight: 600;
    transition: background 0.2s;
  }
  .done-home-btn:hover { background: #29b6f6; }
  .dark-theme .done-home-btn { background: #0288d1; }
  .dark-theme .done-home-btn:hover { background: #0277bd; }

  /* Settings back button */
  .settings-back-btn {
    background: none; border: none;
    font-size: 1.3rem; color: #94a3b8; cursor: pointer;
    padding: 0; line-height: 1; margin-right: 8px;
    transition: color 0.2s;
  }
  .settings-back-btn:hover { color: #4b5563; }

  /* Reset button */
  .reset-btn {
    width: 100%; padding: 12px; border: 1.5px solid #fca5a5;
    border-radius: 10px; background: transparent;
    color: #dc2626; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s, border-color 0.2s;
    margin-top: 20px;
  }
  .reset-btn:hover { background: #fef2f2; border-color: #ef4444; }
  .dark-theme .reset-btn { border-color: #7f1d1d; color: #fca5a5; }
  .dark-theme .reset-btn:hover { background: #450a0a; border-color: #dc2626; }

  /* Confirm dialog */
  .confirm-overlay {
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;
    z-index:999999;padding:20px;
  }
  .confirm-box {
    background:#fff;border-radius:16px;padding:28px;
    max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.25);
    text-align:center;
  }
  .dark-theme .confirm-box { background:#1e293b; color:#e0e0e0; }
  .confirm-box h3 { margin:0 0 12px; font-size:1.1rem; }
  .confirm-box p { font-size:0.9rem; color:#6b7280; margin-bottom:20px; line-height:1.5; }
  .dark-theme .confirm-box p { color:#94a3b8; }
  .confirm-actions { display:flex; gap:10px; }
  .confirm-actions button {
    flex:1; padding:12px; border-radius:10px;
    font-size:0.9rem; font-weight:600; cursor:pointer;
    border:none; transition:background 0.2s;
  }
  .confirm-cancel { background:#e5e7eb; color:#1f2937; }
  .confirm-cancel:hover { background:#d1d5db; }
  .dark-theme .confirm-cancel { background:#374151; color:#e0e0e0; }
  .dark-theme .confirm-cancel:hover { background:#4b5563; }
  .confirm-danger { background:#dc2626; color:#fff; }
  .confirm-danger:hover { background:#b91c1c; }

  /* Stats */
  .stat-section { margin-bottom:16px; }
  .stat-section h3 { font-size:0.9rem; font-weight:600; margin-bottom:8px; color:#1f2937; }
  .dark-theme .stat-section h3 { color:#e0e0e0; }
  .stat-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:0.8rem; }
  .stat-bar-label { width:70px; flex-shrink:0; color:#6b7280; }
  .stat-bar-track { flex:1; height:12px; background:#e5e7eb; border-radius:6px; overflow:hidden; }
  .dark-theme .stat-bar-track { background:#374151; }
  .stat-bar-fill { height:100%; border-radius:6px; transition:width 0.3s; }
  .stat-bar-count { width:36px; text-align:right; font-weight:600; color:#1f2937; flex-shrink:0; }
  .dark-theme .stat-bar-count { color:#e0e0e0; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat-grid-item { background:#f9fafb; border-radius:10px; padding:12px; text-align:center; }
  .dark-theme .stat-grid-item { background:#111827; }
  .stat-grid-num { font-size:1.3rem; font-weight:700; }
  .stat-grid-label { font-size:0.75rem; color:#6b7280; margin-top:2px; }

  /* Auth prompt overlay */
  .auth-prompt {
    text-align: center; padding: 40px 20px;
  }
  .auth-prompt h2 { margin-bottom: 12px; }
  .auth-prompt .big-btn {
    display: inline-block; padding: 14px 32px; border: none;
    border-radius: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    margin: 8px;
  }
  .auth-prompt p { color: #666; margin-bottom: 20px; }
  .dark-theme .auth-prompt p { color: #94a3b8; }
</style>
</head>
<body>

<div class="main-area" id="mainArea">
  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <div>Загрузка слов...</div>
  </div>
</div>

<div id="settingsModal" class="modal-overlay" style="display:none">
  <div class="modal-content">
    <div style="display:flex;align-items:center;margin-bottom:16px">
      <button class="settings-back-btn" id="settingsBackBtn" title="Назад">←</button>
      <h2 style="margin:0;font-size:1.15rem">Настройки</h2>
    </div>

    <div class="setting-row">
      <div class="setting-label">Новых карт в день:</div>
      <input type="number" id="limitNewInput" min="0" max="999" style="width:100%;padding:10px;border-radius:8px;border:2px solid #d1d5db;font-size:1rem;text-align:center">
      <div id="limitNewInfo"></div>
      <div id="limitNewExhausted" style="display:none"></div>
    </div>

    <div class="setting-row" style="margin-bottom:8px">
      <label style="display:flex;justify-content:space-between;align-items:center">
        <span class="setting-label" style="margin-bottom:0">Повторов без лимита:</span>
        <input type="checkbox" id="unlimitedReviews" style="width:20px;height:20px">
      </label>
    </div>
    <div class="setting-row" id="maxReviewsRow">
      <div class="setting-label">Макс повторений в день:</div>
      <input type="number" id="maxReviewsInput" min="0" max="999" style="width:100%;padding:10px;border-radius:8px;border:2px solid #d1d5db;font-size:1rem;text-align:center">
      <div id="maxReviewsInfo"></div>
      <div id="maxReviewsExhausted" style="display:none"></div>
    </div>

    <button id="settingsSaveBtn" style="width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px">Сохранить</button>

    display:flex;align-items:center;justify-content:center;
    z-index:99999;padding:20px;

<script>
(function() {
  'use strict';

  const PASS = 'arab123';
  if (localStorage.getItem('sr_unlock') !== PASS && sessionStorage.getItem('sr_unlock') !== PASS) {
    const p = prompt('Введите пароль для доступа к тренажёру:');
    if (p !== PASS) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#666;font-size:1.2rem">Тренажер в стадии тестирования и доработки. Ожидайте.</div>';
      throw new Error('Access denied');
    }
    sessionStorage.setItem('sr_unlock', PASS);
  }

  const CARD_STORE_KEY = 'arabSrCards';
  const SETTINGS_KEY = 'arabSrSettings';
  const TODAY_KEY = 'arabSrToday';
  const NEW_TODAY_KEY = 'arabSrNewToday';
  const REVIEW_TODAY_KEY = 'arabSrReviewToday';
  const LOGS_KEY = 'arabSrLogs';
  const BOOST_NEW_KEY = 'arabSrBoostNew';
  const BOOST_REVIEW_KEY = 'arabSrBoostReview';

  let allWords = [];
  let notesMap = {};
  let cards = [];
  let queue = [];
  let currentIndex = 0;
  let isFlipped = false;
  let todayCount = 0;
  let newTodayCount = 0;
  let reviewTodayCount = 0;
  let limitNew = 50;
  let unlimitedReviews = true;
  let maxReviews = 0;
  let fsrs;
  let newCardsLeft = 0;
  let sessionAnswered = false;
  let sessionTotal = 0;
  let sessionDone = 0;
  let logs = [];
  let undoStack = [];

  // Час смены дня (как в Anki): день заканчивается в 4 утра.
  // Карта со сроком "завтра" доступна с начала дня, а не с точного времени ответа.
  const DAY_CUTOFF_HOUR = 4;
  function dayStartTs(ts) {
    const d = new Date(ts);
    d.setHours(DAY_CUTOFF_HOUR, 0, 0, 0);
    if (ts < d.getTime()) d.setDate(d.getDate() - 1);
    return d.getTime();
  }
  function isDueByDay(due, now) {
    if (!due) return true;
    return dayStartTs(due) <= dayStartTs(now);
  }
  function srDayKey(now) {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Moscow',
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date(now || Date.now()));
    return parts.find(p => p.type === 'year').value + '-' +
           parts.find(p => p.type === 'month').value + '-' +
           parts.find(p => p.type === 'day').value;
  }

  function loadLogs() {
    try { const d = JSON.parse(localStorage.getItem(LOGS_KEY)); if (Array.isArray(d)) logs = d; } catch(e) {}
  }
  function saveLogs() {
    try { localStorage.setItem(LOGS_KEY, JSON.stringify(logs)); }
    catch(e) {
      if (e.name === 'QuotaExceededError') { logs = logs.slice(-1000); localStorage.setItem(LOGS_KEY, JSON.stringify(logs)); }
    }
  }

  // Настройки
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      if (s) {
        if (s.limitNew) limitNew = s.limitNew;
        if (s.unlimitedReviews !== undefined) unlimitedReviews = s.unlimitedReviews;
        if (s.maxReviews !== undefined) maxReviews = s.maxReviews;
        if (s.w && Array.isArray(s.w) && s.w.length === 19) {
          if (fsrs) fsrs.w = s.w;
          else window._savedW = s.w;
        }
      }
    } catch(e) {}
  }
  function saveSettingsToStorage() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ limitNew, unlimitedReviews, maxReviews, w: fsrs.w }));
  }

  // Сколько новых показано сегодня
  function loadNewTodayCount() {
    try {
      const d = JSON.parse(localStorage.getItem(NEW_TODAY_KEY));
      if (d && d.date === srDayKey()) newTodayCount = d.count || 0;
      else newTodayCount = 0;
    } catch(e) { newTodayCount = 0; }
  }
  function saveNewTodayCount() {
    localStorage.setItem(NEW_TODAY_KEY, JSON.stringify({ date: srDayKey(), count: newTodayCount }));
  }

  function loadReviewTodayCount() {
    try {
      const d = JSON.parse(localStorage.getItem(REVIEW_TODAY_KEY));
      if (d && d.date === srDayKey()) reviewTodayCount = d.count || 0;
      else reviewTodayCount = 0;
    } catch(e) { reviewTodayCount = 0; }
  }
  function saveReviewTodayCount() {
    localStorage.setItem(REVIEW_TODAY_KEY, JSON.stringify({ date: srDayKey(), count: reviewTodayCount }));
  }

  // Boost лимиты (дополнительные к основным)
  let boostNew = 0;
  let boostReview = 0;
  function loadBoostLimits() {
    try {
      const d = JSON.parse(localStorage.getItem(BOOST_NEW_KEY));
      if (d) boostNew = d.boost || 0;
      else boostNew = 0;
    } catch(e) { boostNew = 0; }
    try {
      const d = JSON.parse(localStorage.getItem(BOOST_REVIEW_KEY));
      if (d) boostReview = d.boost || 0;
      else boostReview = 0;
    } catch(e) { boostReview = 0; }
  }
  function saveBoostNew(val) {
    boostNew = val;
    localStorage.setItem(BOOST_NEW_KEY, JSON.stringify({ date: srDayKey(), boost: val }));
  }
  function saveBoostReview(val) {
    boostReview = val;
    localStorage.setItem(BOOST_REVIEW_KEY, JSON.stringify({ date: srDayKey(), boost: val }));
  }

  // Сколько всего повторений сегодня
  function loadTodayCount() {
    try {
      const d = JSON.parse(localStorage.getItem(TODAY_KEY));
      if (d && d.date === srDayKey()) todayCount = d.count || 0;
      else todayCount = 0;
    } catch(e) { todayCount = 0; }
  }
  function saveTodayCount() {
    localStorage.setItem(TODAY_KEY, JSON.stringify({ date: srDayKey(), count: todayCount }));
  }

  function loadCardsLocal() {
    try {
      const d = JSON.parse(localStorage.getItem(CARD_STORE_KEY));
      if (d && Array.isArray(d)) return d;
    } catch(e) {}
    return [];
  }
  function saveCardsLocal(data) {
    localStorage.setItem(CARD_STORE_KEY, JSON.stringify(data));
  }

  function wordToId(wordLine) {
    let hash = 0;
    const s = wordLine.trim().toLowerCase();
    for (let i = 0; i < s.length; i++) {
      const ch = s.charCodeAt(i);
      hash = ((hash << 5) - hash) + ch;
      hash = hash & hash;
    }
    return 'w_' + Math.abs(hash).toString(36);
  }

  async function loadNotes() {
    try {
      const resp = await fetch('notes.json');
      if (resp.ok) {
        const data = await resp.json();
        notesMap = data || {};
      }
    } catch(e) { console.warn('Notes load error:', e); }
  }

  async function loadCardsFromFirestore() {
    if (!window.firestore || !window.auth || !window.authUser) return null;
    try {
      const uid = window.authUser.uid;
      if (typeof window.firestore.collection === 'function') {
        const snap = await window.firestore.collection('users').doc(uid).collection('sr_cards').doc('all').get();
        if (snap.exists) {
          const data = snap.data();
          return data.cards || null;
        }
      }
      return null;
    } catch(e) {
      console.warn('Firestore load error:', e);
      return null;
    }
  }

  async   function saveCardsToFirestore(cardsData) {
    if (!window.firestore || !window.auth || !window.authUser) return;
    try {
      const uid = window.authUser.uid;
      if (typeof window.firestore.collection === 'function') {
        await window.firestore.collection('users').doc(uid).collection('sr_cards').doc('all').set({
          cards: cardsData,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      }
    } catch(e) {
      console.warn('Firestore save error:', e);
    }
  }

  async function saveLogsToFirestore() {
    if (!window.firestore || !window.auth || !window.authUser) return;
    try {
      const uid = window.authUser.uid;
      if (typeof window.firestore.collection !== 'function') return;
      const batchSize = 400;
      const recent = logs.slice(-3000);
      let chunkIndex = 0;
      for (let i = 0; i < recent.length; i += batchSize) {
        const chunk = recent.slice(i, i + batchSize);
        await window.firestore.collection('users').doc(uid).collection('sr_cards').doc('logs_' + chunkIndex).set({
          logs: chunk,
          updatedAt: new Date().toISOString()
        }, { merge: true });
        chunkIndex++;
      }
    } catch(e) {
      console.warn('Firestore logs save error:', e);
    }
  }

  function initCard(wordLine, existingCardsMap) {
    const id = wordToId(wordLine);
    const existing = existingCardsMap[id];
    if (existing) return existing;
    const match = wordLine.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (!match) return null;
    return {
      id,
      ru: match[1].trim(),
      ar: match[2].trim(),
      arKey: match[2].trim().split(/[-–—]/)[0].trim(),
      line: wordLine,
      ...window.FSRS_defaultCard()
    };
  }

  async function init() {
    loadSettings();
    loadTodayCount();
    loadNewTodayCount();
    loadReviewTodayCount();
    loadBoostLimits();
    loadLogs();
    // Миграция на настоящий FSRS-5: старые веса обучены на кривой модели — сбрасываем
    const fsrsV2Done = localStorage.getItem('sr_fsrs_v2') === '1';
    fsrs = new window.FSRS(fsrsV2Done ? (window._savedW || undefined) : undefined);
    delete window._savedW;
    fsrs.maxInterval = 180; // полгода

    try {
      const resp = await fetch('words.txt');
      const text = await resp.text();
      const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#') && /[-–—]/.test(l));
      if (lines.length === 0) throw new Error('No words');
      allWords = lines;
    } catch(e) {
      document.getElementById('mainArea').innerHTML = '<div class="done-state"><div class="icon">❌</div><h2>Не удалось загрузить слова</h2><p>Проверьте файл words.txt</p></div>';
      return;
    }
    await loadNotes();

    let storedCards = loadCardsLocal();
    if (window.auth && window.authUser) {
      const remote = await loadCardsFromFirestore();
      if (remote && remote.length > 0) {
        if (storedCards.length === 0) {
          storedCards = remote;
        } else {
          const remoteMap = {};
          remote.forEach(c => { remoteMap[c.id] = c; });
          const localMap = {};
          storedCards.forEach(c => { localMap[c.id] = c; });
          const merged = [];
          const seen = new Set();
          [...remote, ...storedCards].forEach(c => {
            if (seen.has(c.id)) return;
            seen.add(c.id);
            const r = remoteMap[c.id];
            const l = localMap[c.id];
            if (r && l) {
              merged.push((r.lastReview || 0) > (l.lastReview || 0) ? r : l);
            } else {
              merged.push(r || l);
            }
          });
          storedCards = merged;
        }
      }
      saveCardsLocal(storedCards);

      // Загружаем логи из Firestore (из чанков)
      try {
        const uid = window.authUser.uid;
        if (typeof window.firestore.collection === 'function') {
          const merged = [...logs];
          const localIds = new Set(logs.map(l => l.card_id + l.timestamp));
          let chunkIdx = 0;
          while (true) {
            const snap = await window.firestore.collection('users').doc(uid).collection('sr_cards').doc('logs_' + chunkIdx).get();
            if (!snap.exists || !Array.isArray(snap.data().logs)) break;
            snap.data().logs.forEach(l => {
              const key = l.card_id + l.timestamp;
              if (!localIds.has(key)) { merged.push(l); localIds.add(key); }
            });
            chunkIdx++;
          }
          merged.sort((a, b) => a.timestamp - b.timestamp);
          logs = merged.slice(-10000);
          saveLogs();
        }
      } catch(e) { console.warn('Firestore logs load error:', e); }
    }

    const cardMap = {};
    storedCards.forEach(c => { cardMap[c.id] = c; });

    cards = [];
    allWords.forEach(line => {
      const card = initCard(line, cardMap);
      if (card) cards.push(card);
    });

    migrateToFSRSv2();

    saveCardsLocal(cards);
    if (window.auth && window.authUser) saveCardsToFirestore(cards);

    window.__cards = cards;
    window.__queue = queue;
    renderDeckSelection();
  }

  // Одноразовая миграция на настоящий FSRS-5:
  // пересчитываем stability/difficulty карт, прогоняя историю ответов через правильные формулы
  function migrateToFSRSv2() {
    if (localStorage.getItem('sr_fsrs_v2') === '1') return;

    const byCard = {};
    logs.forEach(l => {
      if (!byCard[l.card_id]) byCard[l.card_id] = [];
      byCard[l.card_id].push(l);
    });
    for (const id in byCard) byCard[id].sort((a, b) => a.timestamp - b.timestamp);

    cards.forEach(card => {
      if (card.state === window.FSRS_STATE.NEW) return;

      const cardLogs = byCard[card.id];
      if (cardLogs && cardLogs.length > 0) {
        // Полный пересчёт из истории ответов
        let replay = window.FSRS_defaultCard();
        cardLogs.forEach(log => {
          const res = fsrs.repeat(replay, log.timestamp);
          replay = res[log.rating];
        });
        card.state = replay.state;
        card.stability = replay.stability;
        card.difficulty = replay.difficulty;
        card.elapsedDays = replay.elapsedDays;
        card.scheduledDays = replay.scheduledDays;
        card.reps = replay.reps;
        card.lapses = replay.lapses;
        card.lastReview = replay.lastReview;
        card.due = replay.due;
        card.step = replay.step;
      } else {
        // Логов нет — консервативно ограничиваем раздутые значения старой модели
        card.stability = Math.min(Math.max(0.1, card.stability || 1), 30);
        card.difficulty = Math.min(10, Math.max(1, card.difficulty || 5));
        if (card.scheduledDays > 30 && card.lastReview) {
          card.scheduledDays = 30;
          card.due = card.lastReview + 30 * 86400000;
        }
      }
    });

    // Старые оптимизированные веса обучены на неправильной модели — сохраняем дефолтные
    saveSettingsToStorage();
    localStorage.setItem('sr_fsrs_v2', '1');
  }

  // Построение очереди как в Anki:
  // 1) Повторяемые (review) — у кого due ≤ сейчас
  // 2) Новые — до лимита
  // 3) Изучаемые (learning) — после новых
  function buildQueue() {
    const now = Date.now();
    const currentDayKey = srDayKey();
    try {
      const d = JSON.parse(localStorage.getItem(TODAY_KEY));
      if (!d || d.date !== currentDayKey) {
        todayCount = 0; saveTodayCount();
        newTodayCount = 0; saveNewTodayCount();
        reviewTodayCount = 0; saveReviewTodayCount();
        boostNew = 0; saveBoostNew(0);
        boostReview = 0; saveBoostReview(0);
      }
    } catch(e) {}
    const effectiveNewLimit = limitNew + boostNew;
    const effectiveReviewLimit = maxReviews + boostReview;
    newCardsLeft = Math.max(0, effectiveNewLimit - newTodayCount);

    const learningCards = [];
    const reviewCards = [];
    const newCards = [];

    cards.forEach(c => {
      if (c.state === window.FSRS_STATE.NEW) {
        newCards.push(c);
      } else if (c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING) {
        if (!c.due || c.due <= now) {
          learningCards.push(c);
        }
      } else if (c.state === window.FSRS_STATE.REVIEW) {
        // Review-карты доступны с начала дня (cutoff 4 утра), как в Anki
        if (isDueByDay(c.due, now)) {
          reviewCards.push(c);
        }
      }
    });

    // Изучаемые — в порядке очереди (по due)
    learningCards.sort((a, b) => (a.due || now) - (b.due || now));
    // Повторяемые — самые просроченные первые
    reviewCards.sort((a, b) => (a.due || now) - (b.due || now));
    if (!unlimitedReviews && effectiveReviewLimit > 0) {
      const reviewRemaining = Math.max(0, effectiveReviewLimit - reviewTodayCount);
      reviewCards.splice(reviewRemaining);
    }
    // Новые — перемешать
    for (let i = newCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newCards[i], newCards[j]] = [newCards[j], newCards[i]];
    }

    queue = [
      ...reviewCards,
      ...newCards.slice(0, newCardsLeft),
      ...learningCards
    ];
    currentIndex = 0;
    sessionTotal = queue.length;
    sessionDone = 0;
  }

  function getStats() {
    const now = Date.now();
    const total = cards.length;
    const newCount = cards.filter(c => c.state === window.FSRS_STATE.NEW).length;
    const learningCount = cards.filter(c => c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING).length;
    const reviewDue = cards.filter(c => c.state === window.FSRS_STATE.REVIEW && isDueByDay(c.due, now)).length;
    return { total, new: newCount, learning: learningCount, due: reviewDue, today: todayCount };
  }

  function renderDeckSelection() {
    const area = document.getElementById('mainArea');
    const stats = getStats();

    area.innerHTML = `
      <div class="deck-card">
        <div class="deck-card-body">
          <div class="deck-stats">
            <div class="deck-stat">Новые: <span class="num-blue">${stats.new}</span></div>
            <div class="deck-stat">Изучаемые: <span class="num-red">${stats.learning}</span></div>
            <div class="deck-stat">Повторяемые: <span class="num-green">${stats.due}</span></div>
            <div class="deck-stat">Всего: <span class="num-gray">${stats.total}</span></div>
          </div>
          <div id="studyMsg" style="display:none;margin-top:8px;padding:8px;border-radius:8px;background:#1e293b;color:#94a3b8;font-size:0.85rem;text-align:center;line-height:1.5"></div>
          <button class="deck-study-btn" id="studyBtn">Учить</button>
        </div>
        <div class="deck-card-footer">
          <button class="deck-settings-btn" id="settingsBtn" title="Настройки">⚙️</button>
        </div>
      </div>
    `;

    document.getElementById('studyBtn').addEventListener('click', () => {
      const hasLearning = cards.filter(c => c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING);
      buildQueue();
      if (queue.length === 0) {
        const msg = document.getElementById('studyMsg');
        if (msg) {
          if (hasLearning.length > 0 && stats.due === 0 && (stats.new === 0 || newCardsLeft <= 0)) {
            const nextDue = Math.min(...hasLearning.map(c => c.due || Infinity));
            const waitSec = Math.max(1, Math.round((nextDue - Date.now()) / 1000));
            msg.innerHTML = '⏳ Изучаемые карты вернутся через ' + (waitSec > 60 ? Math.round(waitSec/60) + ' мин' : waitSec + ' сек') + '.<br><span style="font-size:0.8rem">Они появятся в очереди автоматически.</span>';
          } else if (stats.new > 0 && limitNew > 0 && newCardsLeft <= 0) {
            msg.innerHTML = '📅 Лимит новых слов: ' + limitNew + '.<br><span style="font-size:0.8rem">Чтобы увеличить, откройте <a href="#" id="limitToSettings" style="color:#4fc3f7">настройки</a> и измените дневной лимит.</span>';
          } else {
            msg.innerHTML = '🎉 На сегодня всё!<br><span style="font-size:0.8rem">Возвращайтесь завтра — будут новые слова.</span>';
          }
          msg.style.display = 'block';
          setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }
        return;
      }
      render();
    });
    document.addEventListener('click', function limitHandler(e) {
      const link = e.target.closest('#limitToSettings');
      if (link) { e.preventDefault(); openSettings(); return; }
    });
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
  }

  function render() {
    const area = document.getElementById('mainArea');
    const stats = getStats();

    if (queue.length === 0) {
      const hasLearning = cards.filter(c => c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING);
      if (stats.due === 0 && stats.new === 0 && hasLearning.length === 0) {
        area.innerHTML = `
          <div class="done-state">
            <div class="icon">🎉</div>
            <h2>Все слова повторены!</h2>
            <p>На сегодня всё. Возвращайтесь завтра.</p>
            <div style="font-size:0.9rem;color:#94a3b8;margin-top:12px">
              Повторено сегодня: ${stats.today}
            </div>
            <button class="done-home-btn" id="doneHomeBtn">🏠 На начальный экран</button>
          </div>
        `;
        document.getElementById('doneHomeBtn').addEventListener('click', renderDeckSelection);
      } else if (hasLearning.length > 0 && stats.due === 0 && stats.new === 0) {
        const nextDue = Math.min(...hasLearning.map(c => c.due || Infinity));
        const waitSec = Math.max(1, Math.round((nextDue - Date.now()) / 1000));
        area.innerHTML = `
          <div class="done-state">
            <div class="icon">⏳</div>
            <h2>Ожидание изучения</h2>
            <p>Изучаемые карты вернутся через ${waitSec > 60 ? Math.round(waitSec/60) + ' мин' : waitSec + ' сек'}</p>
          </div>
        `;
        setTimeout(render, Math.min(60000, Math.max(5000, (nextDue - Date.now()))));
      } else {
        buildQueue();
        if (queue.length === 0) {
          area.innerHTML = `
            <div class="done-state">
              <div class="icon">🎉</div>
              <h2>На сегодня всё!</h2>
              <p>Лимит новых карт исчерпан или все слова повторены.</p>
              <div style="font-size:0.9rem;color:#94a3b8;margin-top:12px">
                Повторено сегодня: ${stats.today}
              </div>
              <button class="done-home-btn" id="doneHomeBtn2">🏠 На начальный экран</button>
            </div>
          `;
          document.getElementById('doneHomeBtn2').addEventListener('click', renderDeckSelection);
          return;
        }
        renderCard();
      }
      return;
    }
    renderCard();
  }

  function renderCard() {
    const area = document.getElementById('mainArea');
    const card = queue[currentIndex];
    if (!card) { render(); return; }
    isFlipped = false;

    const front = card.ar;
    const total = sessionTotal;
    const done = sessionDone;
    const pct = total > 0 ? ((done / total) * 100) : 0;
    const now2 = Date.now();
    const r = fsrs.getRetrievability(card, now2);
    const preds = fsrs.repeat(card, now2);
    const fmt = (d) => {
      const min = d * 1440;
      if (min < 1) return '< 1 мин';
      if (d < 1) { const m = Math.round(min); return `~${m} мин`; }
      if (d < 2) return '~1 д';
      return `~${Math.round(d)} д`;
    };

    // Подпись состояния карты
    let stateLabel = '';
    if (card.state === window.FSRS_STATE.NEW) stateLabel = '🆕 Новая';
    else if (card.state === window.FSRS_STATE.LEARNING) stateLabel = '📖 Изучается';
    else if (card.state === window.FSRS_STATE.RELEARNING) stateLabel = '🔄 Переучивается';
    else if (card.state === window.FSRS_STATE.REVIEW) stateLabel = '🔁 Повторение';

    area.innerHTML = `
      <button class="study-back-btn" id="studyBackBtn" title="Назад">←</button>
      <button class="undo-btn ${undoStack.length === 0 ? 'undo-disabled' : ''}" id="undoBtn" title="Отменить последний ответ">↶</button>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card-container">
        <div class="flashcard" id="flashcard">
          <button class="fav-star ${window.isFavorite ? (window.isFavorite(card.line) ? 'active' : '') : ''}" id="favStar">${window.isFavorite && window.isFavorite(card.line) ? '⭐' : '☆'}</button>
          <div class="word-index">${done + 1}/${total}</div>
          <div class="front-text arabic" id="frontText">${front}</div>
          <div class="tap-hint" id="tapHint">👆 нажмите, чтобы увидеть перевод</div>
          <div style="position:absolute;bottom:4px;left:16px;font-size:0.65rem;color:#94a3b8">${stateLabel}</div>
        </div>
      </div>
      <div class="ratings" id="ratings">
        <button class="rating-btn rating-again" data-rating="0">Снова<span class="sub">${fmt(preds[0].scheduledDays)}</span></button>
        <button class="rating-btn rating-hard" data-rating="1">Трудно<span class="sub">${fmt(preds[1].scheduledDays)}</span></button>
        <button class="rating-btn rating-good" data-rating="2">Хорошо<span class="sub">${fmt(preds[2].scheduledDays)}</span></button>
        <button class="rating-btn rating-easy" data-rating="3">Лёгко<span class="sub">${fmt(preds[3].scheduledDays)}</span></button>
      </div>
      <div class="queue-info">Вероятность вспомнить: ${r !== null ? Math.round(r * 100) + '%' : 'Новая карта'}</div>
    `;

    document.getElementById('flashcard').addEventListener('click', (e) => {
      if (e.target.closest('.fav-star')) return;
      flipCard(card);
    });

    const favStar = document.getElementById('favStar');
    if (favStar) {
      favStar.addEventListener('click', () => {
        if (window.toggleFavorite) {
          const val = window.toggleFavorite(card.line);
          favStar.textContent = val ? '⭐' : '☆';
          favStar.classList.toggle('active', val);
        }
      });
    }

    area.querySelectorAll('.rating-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const rating = parseInt(btn.dataset.rating);
        handleRating(card, rating);
      });
    });

    // Клавиши 1-4
    window.__currentCard = card;
    if (!window.__keyHandlerInstalled) {
      window.__keyHandlerInstalled = true;
      document.addEventListener('keydown', function globalKeyHandler(e) {
        if (['1','2','3','4'].includes(e.key) && window.__currentCard) {
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
          const rating = parseInt(e.key) - 1;
          const c = window.__currentCard;
          window.__currentCard = null;
          handleRating(c, rating);
        }
      });
    }

    document.getElementById('undoBtn').addEventListener('click', () => {
      window.__currentCard = null;
      undoLast();
    });

    document.getElementById('studyBackBtn').addEventListener('click', () => {
      if (sessionAnswered) {
        showConfirm(
          'Завершить текущую сессию?',
          'Прогресс по уже отвеченным карточкам сохранится. Вы сможете продолжить обучение позже.',
          'Продолжить обучение',
          'Выйти',
          () => { closeConfirm(); },
          () => { closeConfirm(); goBackToDeck(); }
        );
      } else {
        goBackToDeck();
      }
    });
  }

  function flipCard(card) {
    if (isFlipped) return;
    isFlipped = true;
    const back = card.ru;
    const note = notesMap[card.arKey];
    const noteHtml = note ? `<div class="card-note"><span class="note-label">شرح</span><span class="note-text">${note}</span></div>` : '';
    document.getElementById('frontText').insertAdjacentHTML('afterend', `<div class="back-text" id="backText">${back}</div>${noteHtml}`);
    document.getElementById('tapHint').textContent = '';
  }

  function handleRating(card, rating) {
    // Снапшот для Undo — до любых изменений
    undoStack.push({
      card: Object.assign({}, card),
      wasNew: card.state === window.FSRS_STATE.NEW,
      queueIndex: currentIndex,
      sessionDoneBefore: sessionDone,
      sessionTotalBefore: sessionTotal
    });
    if (undoStack.length > 50) undoStack.shift();

    sessionAnswered = true;
    sessionDone++;
    const now = Date.now();

    // Сохраняем лог для оптимизатора
    logs.push({
      card_id: card.id,
      stability_before: card.stability,
      difficulty_before: card.difficulty,
      elapsed_days: card.elapsedDays,
      state_before: card.state,
      lapses_before: card.lapses,
      reps_before: card.reps,
      rating: rating,
      timestamp: now
    });
    saveLogs();

    const results = fsrs.repeat(card, now);
    const updated = results[rating];

    const idx = cards.findIndex(c => c.id === card.id);
    if (idx !== -1) {
      if (cards[idx].state === window.FSRS_STATE.NEW) {
        newTodayCount++;
        saveNewTodayCount();
      }
      if (cards[idx].state === window.FSRS_STATE.REVIEW) {
        reviewTodayCount++;
        saveReviewTodayCount();
      }
      cards[idx] = updated;
    }

    saveCardsLocal(cards);
    if (window.auth && window.authUser) {
      saveCardsToFirestore(cards);
      saveLogsToFirestore();
    }
    window.__cards = cards;
    window.__queue = queue;

    todayCount++;
    saveTodayCount();

    queue.splice(currentIndex, 1);

    // Как в Anki: learning-карта идёт в КОНЕЦ очереди, без таймера
    if (updated.state === window.FSRS_STATE.LEARNING || updated.state === window.FSRS_STATE.RELEARNING) {
      queue.push(updated);
      sessionTotal = queue.length;
    }

    render();
  }

  function undoLast() {
    if (undoStack.length === 0) return;
    const u = undoStack.pop();

    // Убираем последний лог
    logs.pop();
    saveLogs();

    // Убираем обновлённую версию карты из очереди (могла быть добавлена в конец как learning)
    const qi = queue.findIndex(c => c.id === u.card.id);
    if (qi !== -1) queue.splice(qi, 1);

    // Восстанавливаем карту
    const idx = cards.findIndex(c => c.id === u.card.id);
    if (idx !== -1) cards[idx] = u.card;

    // Возвращаем её в очередь на прежнюю позицию
    queue.splice(Math.min(u.queueIndex, queue.length), 0, u.card);
    currentIndex = Math.min(u.queueIndex, queue.length - 1);

    sessionDone = u.sessionDoneBefore;
    sessionTotal = u.sessionTotalBefore;

    todayCount = Math.max(0, todayCount - 1);
    saveTodayCount();
    if (u.wasNew) {
      newTodayCount = Math.max(0, newTodayCount - 1);
      saveNewTodayCount();
    }
    if (u.card.state === window.FSRS_STATE.REVIEW) {
      reviewTodayCount = Math.max(0, reviewTodayCount - 1);
      saveReviewTodayCount();
    }

    saveCardsLocal(cards);
    if (window.auth && window.authUser) {
      saveCardsToFirestore(cards);
      saveLogsToFirestore();
    }
    window.__cards = cards;
    window.__queue = queue;

    render();
  }

  function goBackToDeck() {
    queue = [];
    currentIndex = 0;
    sessionAnswered = false;
    undoStack = [];
    renderDeckSelection();
  }

  // Подтверждение
  function showConfirm(title, text, cancelLabel, confirmLabel, onCancel, onConfirm) {
    const div = document.createElement('div');
    div.className = 'confirm-overlay';
    div.innerHTML = `
      <div class="confirm-box">
        <h3>${title}</h3>
        <p>${text}</p>
        <div class="confirm-actions">
          <button class="confirm-cancel" id="confirmCancel">${cancelLabel}</button>
          <button class="confirm-danger" id="confirmOk">${confirmLabel}</button>
        </div>
      </div>
    `;
    document.body.appendChild(div);
    div.addEventListener('click', (e) => { if (e.target === div) { onCancel(); div.remove(); } });
    div.querySelector('#confirmCancel').addEventListener('click', () => { onCancel(); div.remove(); });
    div.querySelector('#confirmOk').addEventListener('click', () => { onConfirm(); div.remove(); });
  }

  function closeConfirm() {
    const el = document.querySelector('.confirm-overlay');
    if (el) el.remove();
  }

  async function resetProgress() {
    const defaultCard = window.FSRS_defaultCard();
    cards.forEach(c => {
      Object.assign(c, defaultCard);
      c.id = c.id;
      c.ru = c.ru;
      c.ar = c.ar;
      c.line = c.line;
    });
    saveCardsLocal(cards);
    logs = [];
    saveLogs();
    todayCount = 0;
    saveTodayCount();
    newTodayCount = 0;
    saveNewTodayCount();
    reviewTodayCount = 0;
    saveReviewTodayCount();
    boostNew = 0; boostReview = 0;
    localStorage.removeItem(BOOST_NEW_KEY);
    localStorage.removeItem(BOOST_REVIEW_KEY);
    try {
      if (window.auth && window.authUser) {
        await saveCardsToFirestore(cards);
        try {
          const uid = window.authUser.uid;
          if (typeof window.firestore.collection === 'function') {
            let chunkIdx = 0;
            while (true) {
              const ref = window.firestore.collection('users').doc(uid).collection('sr_cards').doc('logs_' + chunkIdx);
              const snap = await ref.get();
              if (!snap.exists) break;
              await ref.delete();
              chunkIdx++;
            }
          }
        } catch(e) { console.warn('Firestore logs reset error:', e); }
      }
    } catch(e) { console.warn('Firestore cards reset error:', e); }
    document.getElementById('settingsModal').style.display = 'none';
    renderDeckSelection();
  }

  // FSRS Оптимизатор — Adam с численными градиентами
  // Границы весов w0..w18 как в официальном FSRS-5 оптимизаторе
  const W_BOUNDS = [
    [0.001, 100], [0.001, 100], [0.001, 100], [0.001, 100], // w0-w3: начальные стабильности
    [1, 10],       // w4: начальная сложность
    [0.001, 4],    // w5
    [0.001, 4],    // w6
    [0.001, 0.75], // w7: возврат к среднему
    [0, 4.5],      // w8
    [0, 0.8],      // w9
    [0.001, 3.5],  // w10
    [0.001, 5],    // w11
    [0.001, 0.25], // w12
    [0.001, 0.9],  // w13
    [0, 4],        // w14
    [0, 1],        // w15: штраф Hard
    [1, 6],        // w16: бонус Easy
    [0, 2],        // w17: краткосрочная стабильность
    [0, 2]         // w18
  ];

  function computeFSRSLoss(w, byCard) {
    let total = 0; let count = 0;
    const tempFSRS = new window.FSRS(w);
    tempFSRS.maxInterval = fsrs.maxInterval;
    for (const id in byCard) {
      const cardLogs = byCard[id];
      // Реплей истории карты с нуля на кандидатских весах w —
      // стабильность и сложность пересчитываются моделью, а не берутся из лога
      let card = window.FSRS_defaultCard();
      const first = cardLogs[0];
      if (first.state_before !== window.FSRS_STATE.NEW) {
        // История начата не с новой карты — стартуем с состояния из первого лога
        card.state = first.state_before;
        card.stability = first.stability_before || 0;
        card.difficulty = first.difficulty_before || 0;
        card.lapses = first.lapses_before || 0;
        card.reps = first.reps_before || 0;
      }
      for (const log of cardLogs) {
        // Лосс только по долгосрочным повторениям (интервал >= 1 дня),
        // внутрисессионные шаги обучения — шум для к��ивой забывания
        if (card.state === window.FSRS_STATE.REVIEW && card.stability > 0 && log.elapsed_days >= 1) {
          const R = window.FSRS_retrievability(log.elapsed_days, card.stability);
          const p = Math.min(0.999, Math.max(0.001, R));
          // Again = забыл; Hard/Good/Easy = вспомнил (как в официальном FSRS)
          const actual = log.rating >= 1 ? 1 : 0;
          total += -(actual * Math.log(p) + (1 - actual) * Math.log(1 - p));
          count++;
        }
        card.lastReview = log.timestamp - log.elapsed_days * 86400000;
        const res = tempFSRS.repeat(card, log.timestamp);
        card = res[log.rating];
      }
    }
    return count > 0 ? total / count : Infinity;
  }

  function computeGradient(w, byCard, eps) {
    const grad = new Array(19);
    for (let i = 0; i < 19; i++) {
      const wp = w.slice(); wp[i] += eps;
      const wn = w.slice(); wn[i] -= eps;
      grad[i] = (computeFSRSLoss(wp, byCard) - computeFSRSLoss(wn, byCard)) / (2 * eps);
    }
    return grad;
  }

  function optimizeFSRS() {
    const needed = 2500;
    if (logs.length < needed) {
      showConfirm(
        'Недостаточно данных',
        `Для оптимизации нужно минимум ${needed} ответов. Сейчас собрано ${logs.length}. Продолжайте учить слова — логи собираются автоматически.`,
        'OK', '', () => {}, () => {}
      );
      return;
    }

    const byCard = {};
    for (const log of logs) {
      if (!byCard[log.card_id]) byCard[log.card_id] = [];
      byCard[log.card_id].push(log);
    }
    for (const id in byCard) byCard[id].sort((a, b) => a.timestamp - b.timestamp);

    const modal = document.getElementById('settingsModal');
    modal.style.display = 'none';

    document.getElementById('mainArea').innerHTML = `
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <div>Оптимизация FSRS (Adam)... <span id="optProgress">0%</span></div>
      </div>
    `;

    const maxIter = 150;
    const lr = 0.01;
    const beta1 = 0.9, beta2 = 0.999, adamEps = 1e-8;
    let m = new Array(19).fill(0);
    let v = new Array(19).fill(0);
    const initialLoss = computeFSRSLoss(fsrs.w, byCard);
    const initialW = fsrs.w.slice();
    let bestW = fsrs.w.slice();
    let bestLoss = initialLoss;
    let iter = 0;

    function adamStep() {
      const eps = 1e-5;
      const grad = computeGradient(fsrs.w, byCard, eps);
      for (let i = 0; i < 19; i++) {
        m[i] = beta1 * m[i] + (1 - beta1) * grad[i];
        v[i] = beta2 * v[i] + (1 - beta2) * grad[i] * grad[i];
        const mHat = m[i] / (1 - Math.pow(beta1, iter + 1));
        const vHat = v[i] / (1 - Math.pow(beta2, iter + 1));
        fsrs.w[i] -= lr * mHat / (Math.sqrt(vHat) + adamEps);
        fsrs.w[i] = Math.max(W_BOUNDS[i][0], Math.min(W_BOUNDS[i][1], fsrs.w[i]));
      }
      const loss = computeFSRSLoss(fsrs.w, byCard);
      if (loss < bestLoss) { bestLoss = loss; bestW = fsrs.w.slice(); }
      iter++;
      const el = document.getElementById('optProgress');
      if (el) el.textContent = Math.round((iter / maxIter) * 100) + '%';
      if (iter < maxIter) {
        setTimeout(adamStep, 0);
      } else {
        finishOptimization(bestW, bestLoss, initialW, initialLoss);
      }
    }

    setTimeout(adamStep, 100);
  }

  function computeRetention(w) {
    const temp = new window.FSRS(w);
    temp.maxInterval = fsrs.maxInterval;
    let totalR = 0, count = 0;
    cards.forEach(c => {
      if (c.state === window.FSRS_STATE.NEW || !c.lastReview || c.stability <= 0) return;
      const elapsed = ((c.due || Date.now()) - c.lastReview) / 86400000;
      if (elapsed <= 0) return;
      const R = window.FSRS_retrievability(elapsed, c.stability);
      totalR += R; count++;
    });
    return count > 0 ? totalR / count : 0;
  }

  // Пересчёт расписания всех карт под текущие веса (как Reschedule в Anki после оптимизации):
  // реплей истории каждой карты с нуля на новых весах — обновляются stability, difficulty и due
  function rescheduleAllCards() {
    const byCard = {};
    logs.forEach(l => {
      if (!byCard[l.card_id]) byCard[l.card_id] = [];
      byCard[l.card_id].push(l);
    });
    for (const id in byCard) byCard[id].sort((a, b) => a.timestamp - b.timestamp);

    cards.forEach(card => {
      if (card.state === window.FSRS_STATE.NEW) return;
      const cardLogs = byCard[card.id];
      if (cardLogs && cardLogs.length > 0) {
        let replay = window.FSRS_defaultCard();
        cardLogs.forEach(log => {
          const res = fsrs.repeat(replay, log.timestamp);
          replay = res[log.rating];
        });
        card.state = replay.state;
        card.stability = replay.stability;
        card.difficulty = replay.difficulty;
        card.elapsedDays = replay.elapsedDays;
        card.scheduledDays = replay.scheduledDays;
        card.reps = replay.reps;
        card.lapses = replay.lapses;
        card.lastReview = replay.lastReview;
        card.due = replay.due;
        card.step = replay.step;
      } else if (card.state === window.FSRS_STATE.REVIEW && card.lastReview && card.stability > 0) {
        // Логов нет — пересчитываем только интервал из текущей стабильности
        const interval = fsrs._capInterval(Math.max(1, Math.round(fsrs._nextInterval(card.stability))));
        card.scheduledDays = interval;
        card.due = card.lastReview + interval * 86400000;
      }
    });

    saveCardsLocal(cards);
    if (window.auth && window.authUser) saveCardsToFirestore(cards);
  }

  function finishOptimization(bestW, bestLoss, initialW, initialLoss) {
    const oldR = computeRetention(initialW);
    const newR = computeRetention(bestW);
    fsrs.w = bestW;
    cards.forEach(c => {
      if (c.state !== window.FSRS_STATE.NEW) {
        fsrs.getRetrievability(c, Date.now());
      }
    });
    saveSettingsToStorage();
    const rChange = ((newR - oldR) * 100).toFixed(1);
    const rColor = newR >= oldR ? '#22c55e' : '#ef4444';
    document.getElementById('mainArea').innerHTML = `
      <div class="done-state">
        <div class="icon">✅</div>
        <h2>Оптимизация завершена</h2>
        <p style="font-size:0.9rem;color:#94a3b8;margin:4px 0">Предполагаемый уровень запоминания:</p>
        <p style="font-size:1.3rem;font-weight:700;color:${rColor}">${(newR * 100).toFixed(1)}%</p>
        <p style="font-size:0.85rem;color:#94a3b8">Было: ${(oldR * 100).toFixed(1)}% ${newR >= oldR ? '↑' : '↓'}${rChange}%</p>
        <div style="font-size:0.75rem;color:#64748b;margin-top:12px">Это значит: когда карта придёт на повторение, ты скорее всего вспомнишь её в ~${(newR * 100).toFixed(0)}% случаев.</div>
        <div style="margin-top:12px;font-size:0.7rem;color:#64748b;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">📊 показать веса (w0–w18)</div>
        <div style="display:none;margin-top:6px;font-size:0.6rem;color:#64748b;text-align:left;max-width:280px;margin-left:auto;margin-right:auto;line-height:1.5">
          ${initialW.map((v, i) => `<span style="${Math.abs(v - bestW[i]) > 0.001 ? 'color:#facc15;font-weight:600' : ''}">w${i}: ${v.toFixed(4)} → ${bestW[i].toFixed(4)}${Math.abs(v - bestW[i]) > 0.001 ? ' ✓' : ''}</span>`).join('<br>')}
        </div>
        <button class="big-btn" id="optRescheduleBtn" style="margin-top:16px;padding:12px 32px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;display:block;margin-left:auto;margin-right:auto">Пересчитать интервалы карт</button>
        <div style="font-size:0.7rem;color:#64748b;margin-top:6px;max-width:280px;margin-left:auto;margin-right:auto">Реплей истории всех карт на новых весах — сроки повторений обновятся (как Reschedule в Anki)</div>
        <button class="big-btn" onclick="location.reload()" style="margin-top:12px;padding:10px 28px;border:1.5px solid #94a3b8;border-radius:10px;background:transparent;color:#94a3b8;font-size:0.9rem;font-weight:600;cursor:pointer">Продолжить без пересчёта</button>
      </div>
    `;
    document.getElementById('optRescheduleBtn').addEventListener('click', () => {
      rescheduleAllCards();
      location.reload();
    });
  }

  function renderStats() {
    const now = Date.now();
    const total = cards.length;

    const intervals = cards.filter(c => c.state !== window.FSRS_STATE.NEW).map(c => {
      const elapsed = c.lastReview ? (now - c.lastReview) / 86400000 : 0;
      const stability = c.stability || 1;
      return { card: c, retrievability: window.FSRS_retrievability(elapsed, stability) };
    });

    // Распределение retrievability
    const rBins = [0, 0, 0, 0, 0];
    intervals.forEach(({ retrievability: r }) => {
      if (r <= 0.6) rBins[0]++;
      else if (r <= 0.7) rBins[1]++;
      else if (r <= 0.8) rBins[2]++;
      else if (r <= 0.9) rBins[3]++;
      else rBins[4]++;
    });
    const rLabels = ['<60%', '60%', '70%', '80%', '90%+'];
    const rMax = Math.max(...rBins, 1);

    // Распределение сложности
    const dCounts = [0, 0, 0, 0, 0];
    cards.filter(c => c.state !== window.FSRS_STATE.NEW).forEach(c => {
      const d = c.difficulty || 5;
      if (d <= 3) dCounts[0]++;
      else if (d <= 5) dCounts[1]++;
      else if (d <= 7) dCounts[2]++;
      else if (d <= 9) dCounts[3]++;
      else dCounts[4]++;
    });
    const dLabels = ['Лёгкие', 'Средние', 'Трудные', 'Сложные', 'Кошмар'];
    const dMax = Math.max(...dCounts, 1);

    const newC = cards.filter(c => c.state === window.FSRS_STATE.NEW).length;
    const learningC = cards.filter(c => c.state === window.FSRS_STATE.LEARNING || c.state === window.FSRS_STATE.RELEARNING).length;
    const reviewC = cards.filter(c => c.state === window.FSRS_STATE.REVIEW).length;
    const matureC = cards.filter(c => c.state === window.FSRS_STATE.REVIEW && c.stability >= 21).length;

    document.getElementById('statsContent').innerHTML = `
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-grid-item"><div class="stat-grid-num" style="color:#3b82f6">${newC}</div><div class="stat-grid-label">Новые</div></div>
        <div class="stat-grid-item"><div class="stat-grid-num" style="color:#ef4444">${learningC}</div><div class="stat-grid-label">Изучаемые</div></div>
        <div class="stat-grid-item"><div class="stat-grid-num" style="color:#22c55e">${reviewC}</div><div class="stat-grid-label">Повторяемые</div></div>
        <div class="stat-grid-item"><div class="stat-grid-num" style="color:#6b7280">${matureC}</div><div class="stat-grid-label">Зрелые (>21д)</div></div>
      </div>

      <div class="stat-section">
        <h3>Кривая забывания (retrievability)</h3>
        ${rLabels.map((label, i) => `
          <div class="stat-bar-row">
            <span class="stat-bar-label">${label}</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(rBins[i] / rMax * 100)}%;background:${['#ef4444','#f97316','#eab308','#22c55e','#3b82f6'][i]}"></div></div>
            <span class="stat-bar-count">${rBins[i]}</span>
          </div>
        `).join('')}
      </div>

      <div class="stat-section">
        <h3>Сложность карт <span style="font-size:0.65rem;font-weight:400;color:#64748b">(нажми на число)</span></h3>
        ${dLabels.map((label, i) => `
          <div class="stat-bar-row">
            <span class="stat-bar-label">${label}</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(dCounts[i] / dMax * 100)}%;background:${['#22c55e','#3b82f6','#f97316','#ef4444','#dc2626'][i]}"></div></div>
            <span class="stat-bar-count" data-diff-bin="${i}" data-dlabel="${label}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px">${dCounts[i]}</span>
          </div>`
        ).join('')}
      </div>

      <div style="font-size:0.8rem;color:#94a3b8;text-align:center;margin-top:8px">
        Повторено сегодня: ${todayCount}
      </div>
    `;
  }

  // Прогноз нагрузки: сколько review-карт придёт в каждый из следующих 14 дней
  function renderForecast() {
    const now = Date.now();
    const todayStart = dayStartTs(now);
    const DAYS = 14;
    const counts = new Array(DAYS).fill(0);
    let later = 0;

    cards.forEach(c => {
      if (c.state !== window.FSRS_STATE.REVIEW || !c.due) return;
      const dueDay = dayStartTs(c.due);
      const dayOffset = Math.round((dueDay - todayStart) / 86400000);
      if (dayOffset <= 0) counts[0]++;           // просроченные + сегодня
      else if (dayOffset < DAYS) counts[dayOffset]++;
      else later++;
    });

    const maxC = Math.max(...counts, 1);
    const dayNames = ['вс','пн','вт','ср','чт','пт','сб'];
    const rows = counts.map((cnt, i) => {
      const d = new Date(todayStart + i * 86400000);
      const label = i === 0 ? 'Сегодня' : (i === 1 ? 'Завтра' : `${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')} ${dayNames[d.getDay()]}`);
      const color = cnt === 0 ? '#e5e7eb' : (cnt > 40 ? '#ef4444' : cnt > 20 ? '#f97316' : '#22c55e');
      return `
        <div class="stat-bar-row">
          <span class="stat-bar-label" style="width:78px">${label}</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(cnt / maxC * 100)}%;background:${color}"></div></div>
          <span class="stat-bar-count">${cnt}</span>
        </div>`;
    }).join('');

    const total14 = counts.reduce((a, b) => a + b, 0);
    const avg = (total14 / DAYS).toFixed(1);

    document.getElementById('forecastContent').innerHTML = `
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-grid-item"><div class="stat-grid-num" style="color:#0891b2">${total14}</div><div class="stat-grid-label">За 14 дней</div></div>
        <div class="stat-grid-item"><div class="stat-grid-num" style="color:#6b7280">${avg}</div><div class="stat-grid-label">В среднем в день</div></div>
      </div>
      <div class="stat-section">
        <h3>Повторения по дням</h3>
        ${rows}
      </div>
      ${later > 0 ? `<div style="font-size:0.8rem;color:#94a3b8;text-align:center;margin-top:8px">Позже 14 дней: ещё ${later} карт</div>` : ''}
      <div style="font-size:0.7rem;color:#64748b;text-align:center;margin-top:8px">Без учёта новых карт и забываний — реальная нагрузка будет выше</div>
    `;
  }

  function showWordsByDifficulty(binIndex, label) {
    const words = cards.filter(c => c.state !== window.FSRS_STATE.NEW).filter(c => {
      const d = c.difficulty || 5;
      if (binIndex === 0) return d <= 3;
      if (binIndex === 1) return d > 3 && d <= 5;
      if (binIndex === 2) return d > 5 && d <= 7;
      if (binIndex === 3) return d > 7 && d <= 9;
      return d > 9;
    });
    document.getElementById('wordListTitle').textContent = `${label} (${words.length})`;
    document.getElementById('wordListBody').innerHTML = words.length === 0
      ? '<div style="color:#94a3b8;text-align:center;padding:20px">Нет карт</div>'
      : words.map(c => {
          const text = c.line || (c.ru && c.ar ? c.ru + ' – ' + c.ar : c.id || '');
          return `<div style="padding:4px 0;border-bottom:1px solid #f1f5f9">${text}</div>`;
        }).join('');
    document.getElementById('wordListModal').style.display = 'flex';
  }

  document.getElementById('wordListBackBtn').addEventListener('click', () => {
    document.getElementById('wordListModal').style.display = 'none';
  });
  document.getElementById('wordListModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.target.style.display = 'none';
  });
  document.getElementById('wordListCopyBtn').addEventListener('click', () => {
    const text = Array.from(document.getElementById('wordListBody').children).map(div => div.textContent.trim()).filter(Boolean).join('\n');
    navigator.clipboard.writeText(text).catch(() => {});
    const btn = document.getElementById('wordListCopyBtn');
    const orig = btn.textContent;
    btn.textContent = 'Скопировано!';
    setTimeout(() => btn.textContent = orig, 1500);
  });

  // Настройки
  function openSettings() {
    loadBoostLimits();
    const modal = document.getElementById('settingsModal');
    document.getElementById('limitNewInput').value = limitNew;
    document.getElementById('maxReviewsInput').value = maxReviews;
    document.getElementById('unlimitedReviews').checked = unlimitedReviews;
    document.getElementById('maxReviewsRow').style.display = unlimitedReviews ? 'none' : 'block';
    renderLimitInfo();
    modal.style.display = 'flex';
  }

  function renderLimitInfo() {
    const newDailyRemaining = Math.max(0, limitNew - newTodayCount);
    const newBoostRemaining = Math.max(0, boostNew - Math.max(0, newTodayCount - limitNew));
    const newDailyExhausted = newDailyRemaining <= 0 && limitNew > 0;
    const newInfoEl = document.getElementById('limitNewInfo');
    const newExhEl = document.getElementById('limitNewExhausted');
    let infoHtml = '<div class="setting-limit-info"><span>Ежедневный лимит: <b>' + limitNew + '</b></span><span class="setting-limit-remaining">Осталось: ' + newDailyRemaining + '</span></div>';
    if (boostNew > 0) {
      infoHtml += '<div class="setting-limit-info"><span>Добавлено: <b>' + boostNew + '</b></span><span class="setting-limit-remaining">Осталось: ' + newBoostRemaining + '</span></div>';
    }
    newInfoEl.innerHTML = infoHtml;
    if (newDailyExhausted) {
      newExhEl.style.display = 'block';
      newExhEl.innerHTML = '<div class="setting-exhausted"><div class="setting-exhausted-text">Лимит исчерпан, сброс в 00:00 (по мск)</div><div class="setting-exhausted-row"><button class="setting-boost-btn" id="boostNewBtn">Добавить ещё</button></div></div>';
      document.getElementById('boostNewBtn').addEventListener('click', () => openBoostModal('new'));
    } else {
      newExhEl.style.display = 'none';
    }

    if (!unlimitedReviews) {
      const revDailyRemaining = Math.max(0, maxReviews - reviewTodayCount);
      const revBoostRemaining = Math.max(0, boostReview - Math.max(0, reviewTodayCount - maxReviews));
      const revDailyExhausted = revDailyRemaining <= 0 && maxReviews > 0;
      const revInfoEl = document.getElementById('maxReviewsInfo');
      const revExhEl = document.getElementById('maxReviewsExhausted');
      let revInfoHtml = '<div class="setting-limit-info"><span>Ежедневный лимит: <b>' + maxReviews + '</b></span><span class="setting-limit-remaining">Осталось: ' + revDailyRemaining + '</span></div>';
      if (boostReview > 0) {
        revInfoHtml += '<div class="setting-limit-info"><span>Добавлено: <b>' + boostReview + '</b></span><span class="setting-limit-remaining">Осталось: ' + revBoostRemaining + '</span></div>';
      }
      revInfoEl.innerHTML = revInfoHtml;
      if (revDailyExhausted) {
        revExhEl.style.display = 'block';
        revExhEl.innerHTML = '<div class="setting-exhausted"><div class="setting-exhausted-text">Лимит исчерпан, сброс в 00:00 (по мск)</div><div class="setting-exhausted-row"><button class="setting-boost-btn" id="boostReviewBtn">Добавить ещё</button></div></div>';
        document.getElementById('boostReviewBtn').addEventListener('click', () => openBoostModal('review'));
      } else {
        revExhEl.style.display = 'none';
      }
    }
  }

  function openBoostModal(type) {
    const modal = document.getElementById('boostModal');
    const title = document.getElementById('boostTitle');
    const desc = document.getElementById('boostDesc');
    const input = document.getElementById('boostInput');
    if (type === 'new') {
      title.textContent = 'Добавить новых карт';
      desc.textContent = 'Вы добавили сегодня: ' + boostNew;
      input.value = '';
    } else {
      title.textContent = 'Добавить повторений';
      desc.textContent = 'Вы добавили сегодня: ' + boostReview;
      input.value = '';
    }
    input.focus();
    modal.style.display = 'flex';
    modal._boostType = type;
  }

  document.getElementById('boostSaveBtn').addEventListener('click', () => {
    const modal = document.getElementById('boostModal');
    const type = modal._boostType;
    const addVal = parseInt(document.getElementById('boostInput').value) || 0;
    if (addVal < 1) return;
    if (type === 'new') {
      saveBoostNew(boostNew + addVal);
    } else {
      saveBoostReview(boostReview + addVal);
    }
    modal.style.display = 'none';
    renderLimitInfo();
  });
  document.getElementById('boostCancelBtn').addEventListener('click', () => {
    document.getElementById('boostModal').style.display = 'none';
  });
  document.getElementById('boostModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.target.style.display = 'none';
  });

  document.getElementById('settingsSaveBtn').addEventListener('click', () => {
    limitNew = Math.max(0, parseInt(document.getElementById('limitNewInput').value) || 0);
    maxReviews = Math.max(0, parseInt(document.getElementById('maxReviewsInput').value) || 0);
    unlimitedReviews = document.getElementById('unlimitedReviews').checked;
    saveSettingsToStorage();
    document.getElementById('settingsModal').style.display = 'none';
  });
  document.getElementById('unlimitedReviews').addEventListener('change', function() {
    document.getElementById('maxReviewsRow').style.display = this.checked ? 'none' : 'block';
    renderLimitInfo();
  });
  document.getElementById('settingsBackBtn').addEventListener('click', () => {
    document.getElementById('settingsModal').style.display = 'none';
  });
  document.getElementById('statsBtn').addEventListener('click', () => {
    document.getElementById('settingsModal').style.display = 'none';
    renderStats();
    document.getElementById('statsModal').style.display = 'flex';
  });
  document.getElementById('optimizeBtn').addEventListener('click', () => optimizeFSRS());
  document.getElementById('forecastBtn').addEventListener('click', () => {
    document.getElementById('settingsModal').style.display = 'none';
    renderForecast();
    document.getElementById('forecastModal').style.display = 'flex';
  });
  document.getElementById('forecastBackBtn').addEventListener('click', () => {
    document.getElementById('forecastModal').style.display = 'none';
    document.getElementById('settingsModal').style.display = 'flex';
  });
  document.getElementById('forecastModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.target.style.display = 'none';
  });
  document.getElementById('statsBackBtn').addEventListener('click', () => {
    document.getElementById('statsModal').style.display = 'none';
    document.getElementById('settingsModal').style.display = 'flex';
  });
  document.getElementById('statsModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.target.style.display = 'none';
  });
  document.addEventListener('click', function diffHandler(e) {
    const el = e.target.closest('[data-diff-bin]');
    if (!el) return;
    showWordsByDifficulty(parseInt(el.dataset.diffBin), el.dataset.dlabel);
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    showConfirm(
      'Сбросить весь прогресс?',
      'Это действие удалит весь прогресс обучения для этой колоды на всех ваших устройствах. Все интервалы повторения, даты изучения и статистика будут сброшены. Отменить это действие невозможно.',
      'Отмена',
      'Сбросить прогресс',
      () => {},
      () => { resetProgress(); }
    );
  });
  document.getElementById('settingsModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.target.style.display = 'none';
  });

  // Синхронизация при смене auth
  window.addEventListener('authChanged', async () => {
    if (window.authUser && cards.length > 0) {
      const remote = await loadCardsFromFirestore();
      if (remote && remote.length > 0) {
        const remoteMap = {};
        remote.forEach(c => { remoteMap[c.id] = c; });
        let changed = false;
        cards.forEach((c, i) => {
          if (remoteMap[c.id]) {
            const r = remoteMap[c.id];
            if ((r.lastReview || 0) > (c.lastReview || 0)) {
              cards[i] = r;
              changed = true;
            }
          }
        });
        if (changed) {
          saveCardsLocal(cards);
          buildQueue();
          render();
        }
      }
      saveCardsToFirestore(cards);
    } else if (!window.authUser && cards.length === 0) {
      init();
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
