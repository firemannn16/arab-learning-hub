    <div class="container">
        <h1 id="pageTitle">Тесты по правилам</h1>
        <p class="subtitle" id="pageSubtitle">Напишите ответ и нажмите «Ответить»</p>

        <!-- Начальный экран -->
        <div id="startScreen">
            <div class="deck-card">
                <div class="deck-card-title">📚 Тесты по правилам</div>
                <div class="deck-card-body">
                    <div class="deck-stats">
                        <div class="deck-stat">Всего: <span class="num-gray" id="startTotal">0</span></div>
                        <div class="deck-stat">Пройдено: <span class="num-gray" id="startDone">0</span></div>
                    </div>
                    <button class="deck-study-btn" id="startBtn">Начать</button>
                </div>
            </div>
        </div>

        <div id="quizScreen">
            <div style="display:flex;justify-content:flex-start;margin-bottom:12px;">
                <button class="btn btn-secondary" id="backToStartBtn" onclick="backToStartScreen()" style="flex:none;width:48px;padding:8px 0;font-size:1.1rem;line-height:1">←</button>
            </div>
            <div class="progress-bar">
                <div class="progress-text">
                    <span>Вопрос <span id="currentNum">1</span> из <span id="totalNum">0</span></span>
                    <span>Осталось: <span id="remainingCount">0</span></span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="card">
                <div class="rule-badge" id="ruleBadge"></div>
                <div class="question-text" id="questionText"></div>
                <input type="text" class="answer-input" id="answerInput" autocomplete="off" placeholder="Введите ответ...">
                <div class="actions">
                    <button class="btn btn-primary" id="answerBtn" onclick="revealAnswer()">Ответить</button>
                </div>
                <div class="reference-block" id="referenceBlock">
                    <div class="reference-title">Эталон ответа</div>
                    <div class="reference-text" id="referenceText"></div>
                </div>
                <div class="eval-actions hidden" id="evalActions">
                    <button class="btn btn-secondary btn-sm" id="nextBtn" onclick="nextQuestion()">Далее →</button>
                    <button class="btn btn-success btn-eval" id="correctBtn" onclick="toggleEval('correct')" title="Ответил верно">✅</button>
                    <button class="btn btn-danger btn-eval" id="wrongBtn" onclick="toggleEval('wrong')" title="Ответил неверно">❌</button>
                </div>

            <div class="card done-card hidden" id="doneCard">
                <div class="done-icon">✅</div>

                <button class="btn btn-primary" onclick="resetProgress()">🔄 Сбросить прогресс и начать заново</button>
            </div>
        </div>

        <!-- Модалка правил для повторения -->
        <div class="overlay hidden" id="reviewModal">
            <div class="modal">
                <h3>📚 Правила для повторения</h3>
                <p>Ты ответил неверно на вопросы по этим правилам:</p>
                <div class="rules-list-content" id="reviewListContent"></div>
                <div class="modal-actions" style="margin-top: 15px;">
                    <button class="btn btn-secondary" onclick="copyReviewList()" style="flex:none;width:48px;padding:10px 0;font-size:1.1rem" title="Копировать список">📋</button>
                    <button class="btn btn-primary" onclick="closeReviewModal()">Ок</button>

            <button class="btn btn-danger" onclick="resetProgress()">🔄 Сбросить прогресс</button>

    <!-- Кнопка списка правил -->
    <button class="rules-list-btn" id="rulesListBtn" onclick="showRulesList()" title="Список правил">📋</button>

    <!-- Модалка списка правил -->
    <div class="overlay hidden rules-list-modal" id="rulesListModal">
        <div class="modal">
            <h3>📋 Список правил</h3>
            <p>Правила, по которым составлены тесты:</p>
            <div class="rules-list-content" id="rulesListContent"></div>
            <div class="modal-actions" style="margin-top: 15px;">
                <button class="btn btn-secondary" onclick="copyRulesList()" style="flex:none;padding:10px 16px;font-size:0.85rem">📋 Копировать список</button>
                <button class="btn btn-secondary" onclick="closeRulesList()">Закрыть</button>
            </div>
        </div>

    <script>
        // Сохранение последней страницы для PWA
        localStorage.setItem('arabLastPage', 'rules-test.html');

        let allQuestions = [];
        let pendingQueue = [];
        let currentIndex = 0;
        let answeredIds = new Set();
        let reviewRules = new Set();
        let evalChoice = null;

        document.addEventListener('DOMContentLoaded', async () => {
            answeredIds = loadAnsweredIds();
            reviewRules = loadReviewRules();
            await loadQuestions();
            showStartScreen();
        });

        // ===== Начальный экран =====
        function setHeaderVisible(visible) {
            document.getElementById('pageTitle').style.display = visible ? '' : 'none';
            document.getElementById('pageSubtitle').style.display = visible ? '' : 'none';
        }

        function updateStartStats() {
            document.getElementById('startTotal').textContent = allQuestions.length;
            document.getElementById('startDone').textContent = answeredIds.size;
        }

        function showStartScreen() {
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('quizScreen').classList.add('hidden');
            setHeaderVisible(false);
            updateStartStats();
        }

        function startFromScreen() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            setHeaderVisible(true);
            startExercise();
        }

        function startScreenVisible() {
            const s = document.getElementById('startScreen');
            return s && !s.classList.contains('hidden');
        }

        function refreshStartIfVisible() {
            if (startScreenVisible()) updateStartStats();
        }

        function refreshAfterQuestionsChange() {
            if (startScreenVisible()) {
                updateStartStats();
            } else {
                startExercise();
            }
        }

        document.getElementById('startBtn').addEventListener('click', startFromScreen);

        // ===== Синхронизация прогресса тестов через Firestore =====
        let rulesProgressAt = 0;
        let progressPushTimer = null;

        function quizLive() {
            const quiz = document.getElementById('quizScreen');
            if (!quiz || quiz.classList.contains('hidden')) return false;
            const done = document.getElementById('doneCard');
            if (!done || !done.classList.contains('hidden')) return false;
            return pendingQueue.length > 0 && currentIndex < pendingQueue.length;
        }

        function persistProgressLocal() {
            try { localStorage.setItem('rulesTestAnsweredIds', JSON.stringify([...answeredIds])); } catch(e) {}
            try { localStorage.setItem('rulesTestReviewRules', JSON.stringify([...reviewRules])); } catch(e) {}
        }

        function doPushProgress() {
            if (typeof TrainerSync === 'undefined') return;
            TrainerSync.push('rules_test_progress', {
                answeredIds: [...answeredIds],
                reviewRules: [...reviewRules]
            });
        }

        function scheduleProgressPush() {
            if (progressPushTimer) clearTimeout(progressPushTimer);
            progressPushTimer = setTimeout(function() {
                progressPushTimer = null;
                doPushProgress();
                rulesProgressAt = TrainerSync.lastAt('rules_test_progress');
            }, 1000);
        }

        function applyProgressRemote(data) {
            const remoteAt = data.updatedAt || 0;
            if (remoteAt < rulesProgressAt) {
                doPushProgress();
                rulesProgressAt = TrainerSync.lastAt('rules_test_progress');
                return;
            }
            if (remoteAt === rulesProgressAt) return;
            answeredIds = new Set(Array.isArray(data.answeredIds) ? data.answeredIds : []);
            reviewRules = new Set(Array.isArray(data.reviewRules) ? data.reviewRules : []);
            persistProgressLocal();
            rulesProgressAt = remoteAt;
            if (!quizLive()) refreshStartIfVisible();
        }

        function initRulesSync() {
            if (typeof TrainerSync === 'undefined') return;
            TrainerSync.register('rules_test_progress', {
                onMissing: function() {
                    if (answeredIds.size || reviewRules.size) scheduleProgressPush();
                },
                onRemote: applyProgressRemote
            });
        }
        initRulesSync();

        function backToStartScreen() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            setHeaderVisible(false);
            updateStartStats();
        }

        function loadAnsweredIds() {
            try {
                const data = localStorage.getItem('rulesTestAnsweredIds');
                return data ? new Set(JSON.parse(data)) : new Set();
            } catch(e) {
                return new Set();
            }
        }

        function saveAnsweredIds() {
            localStorage.setItem('rulesTestAnsweredIds', JSON.stringify([...answeredIds]));
            scheduleProgressPush();
        }

        function loadReviewRules() {
            try {
                const data = localStorage.getItem('rulesTestReviewRules');
                return data ? new Set(JSON.parse(data)) : new Set();
            } catch(e) {
                return new Set();
            }
        }

        function saveReviewRules() {
            localStorage.setItem('rulesTestReviewRules', JSON.stringify([...reviewRules]));
            scheduleProgressPush();
        }

        async function loadQuestions() {
            let fileQuestions = [];
            try {
                const resp = await fetch('questions.json?' + Date.now());
                if (resp.ok) {
                    fileQuestions = await resp.json();
                }
            } catch(e) {
                console.warn('Ошибка загрузки questions.json:', e);
            }
            const seen = new Set();
            allQuestions = [];
            for (const q of fileQuestions) {
                if (!seen.has(q.id)) {
                    seen.add(q.id);
                    allQuestions.push(q);
                }
            }
        }

        function startExercise() {
            pendingQueue = shuffleArray(allQuestions.filter(q => !answeredIds.has(q.id)));
            currentIndex = 0;
            document.getElementById('totalNum').textContent = allQuestions.length;
            updateRemaining();
            showQuestion();
        }

        function updateRemaining() {
            document.getElementById('remainingCount').textContent = pendingQueue.length;
        }

        function showQuestion() {
            if (currentIndex >= pendingQueue.length) {
                document.getElementById('doneCard').classList.remove('hidden');
                if (reviewRules.size > 0) showReviewModal();
                return;
            }

            const q = pendingQueue[currentIndex];

            document.getElementById('currentNum').textContent = currentIndex + 1;
            document.getElementById('totalNum').textContent = allQuestions.length;
            document.getElementById('progressFill').style.width = ((allQuestions.length - pendingQueue.length + currentIndex) / allQuestions.length) * 100 + '%';

            document.getElementById('ruleBadge').textContent = q.rule || 'Без правила';
            document.getElementById('ruleBadge').style.display = q.rule ? '' : 'none';

            document.getElementById('questionText').innerHTML = highlightArabic(q.question);

            const input = document.getElementById('answerInput');
            input.value = '';
            input.disabled = false;
            input.focus();

            document.getElementById('answerBtn').classList.remove('hidden');
            document.getElementById('evalActions').classList.add('hidden');
            document.getElementById('correctBtn').classList.remove('selected');
            document.getElementById('wrongBtn').classList.remove('selected');
            document.getElementById('nextBtn').disabled = false;

            const refBlock = document.getElementById('referenceBlock');
            refBlock.classList.remove('show');

            document.getElementById('doneCard').classList.add('hidden');
        }

        function revealAnswer() {
            const input = document.getElementById('answerInput');
            if (!input.value.trim()) return;

            const q = pendingQueue[currentIndex];
            answeredIds.add(q.id);
            saveAnsweredIds();

            document.getElementById('referenceText').textContent = q.reference;
            document.getElementById('referenceBlock').classList.add('show');
            document.getElementById('answerInput').disabled = true;
            document.getElementById('answerBtn').classList.add('hidden');
            document.getElementById('evalActions').classList.remove('hidden');
            document.getElementById('correctBtn').classList.remove('selected');
            document.getElementById('wrongBtn').classList.remove('selected');
            document.getElementById('nextBtn').disabled = true;

            evalChoice = null;
            updateRemaining();
        }

        function toggleEval(choice) {
            const correctBtn = document.getElementById('correctBtn');
            const wrongBtn = document.getElementById('wrongBtn');
            const nextBtn = document.getElementById('nextBtn');

            // Повторное нажатие на выбранную кнопку — отменяем выбор
            if (evalChoice === choice) {
                evalChoice = null;
                correctBtn.classList.remove('selected');
                wrongBtn.classList.remove('selected');
                nextBtn.disabled = true;
                return;
            }

            // Выбираем другую кнопку
            evalChoice = choice;
            correctBtn.classList.remove('selected');
            wrongBtn.classList.remove('selected');
            if (choice === 'correct') {
                correctBtn.classList.add('selected');
            } else {
                wrongBtn.classList.add('selected');
            }
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            const q = pendingQueue[currentIndex];
            if (evalChoice === 'wrong' && q && q.rule) {
                reviewRules.add(q.rule);
                saveReviewRules();
            }
            currentIndex++;
            evalChoice = null;
            showQuestion();
        }

        function resetProgress() {
            if (!confirm('Сбросить прогресс? Отвеченные вопросы будут открыты заново.')) return;
            answeredIds = new Set();
            saveAnsweredIds();
            reviewRules = new Set();
            saveReviewRules();
            refreshAfterQuestionsChange();
        }

        function showReviewModal() {
            const content = document.getElementById('reviewListContent');
            const rules = [...reviewRules];
            content.innerHTML = rules.length > 0
                ? rules.map((rule, i) =>
                    `<div class="rules-list-item"><div class="rules-list-item-inner"><span class="rules-list-num">${i + 1}</span>${rule}</div></div>`
                  ).join('')
                : '<p style="color:#666">Нет правил для повторения — всё верно!</p>';
            document.getElementById('reviewModal').classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').classList.add('hidden');
        }

        function copyReviewList() {
            const rules = [...reviewRules];
            if (rules.length === 0) {
                alert('Список пуст');
                return;
            }
            const text = rules.map((r, i) => `${i + 1}. ${r}`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Список правил скопирован');
            }).catch(() => {
                alert('❌ Не удалось скопировать');
            });
        }

        document.getElementById('reviewModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeReviewModal();
        });

        function shuffleArray(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function highlightArabic(text) {
            return text.replace(/([\u0600-\u06FF][\u0600-\u06FF\s\u064B-\u0652]*[\u0600-\u06FF]|[\u0600-\u06FF])/g,
                '<span class="ar">$1</span>');
        }

        document.getElementById('answerInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const nextBtn = document.getElementById('nextBtn');
                if (!nextBtn.classList.contains('hidden') && !nextBtn.disabled) {
                    nextQuestion();
                } else if (!document.getElementById('answerBtn').classList.contains('hidden')) {
                    revealAnswer();
                }
            }
        });

        // ===== Список правил =====
        function showRulesList() {
            const seen = new Set();
            const rules = [];
            for (const q of allQuestions) {
                if (q.rule && !seen.has(q.rule)) {
                    seen.add(q.rule);
                    rules.push(q.rule);
                }
            }
            const content = document.getElementById('rulesListContent');
            if (rules.length === 0) {
                content.innerHTML = '<p style="color:#666">Правила не найдены</p>';
            } else {
                content.innerHTML = rules.map((rule, i) =>
                    `<div class="rules-list-item"><div class="rules-list-item-inner"><span class="rules-list-num">${i + 1}</span>${rule}</div></div>`
                ).join('');
            }
            document.getElementById('rulesListModal').classList.remove('hidden');
        }

        function closeRulesList() {
            document.getElementById('rulesListModal').classList.add('hidden');
        }

        function copyRulesList() {
            const seen = new Set();
            const rules = [];
            for (const q of allQuestions) {
                if (q.rule && !seen.has(q.rule)) {
                    seen.add(q.rule);
                    rules.push(q.rule);
                }
            }
            const text = rules.map((r, i) => `${i + 1}. ${r}`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Список правил скопирован');
            }).catch(() => {
                alert('❌ Не удалось скопировать');
            });
        }

        document.getElementById('rulesListModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeRulesList();
        });
    </script>
</body>
</html>
